<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fb923c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Meals"><meta name="format-detection" content="telephone=no">

<title>FitPlan Meals</title><style>:root{--bg:#fff8f1;--card:#fff;--ink:#3b2f2a;--muted:#8a7a70;--line:#f1e4d8;--pri:#ea580c;--pri2:#f59e0b;--soft:#fff1e6;--ok:#15803d;--okbg:#e8f7ec;--warnbg:#fff4d6;--sale:#e11d48;--salebg:#ffe4ea;--r:20px}
*{box-sizing:border-box}
body{margin:0;font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);line-height:1.45;font-size:15px}
a{color:var(--pri)}
header{background:linear-gradient(135deg,#fb923c,#f59e0b);color:#fff;padding:18px 16px 54px}
header .wrap{max-width:1040px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header h1{margin:0;font-size:24px;letter-spacing:-.3px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.22);color:#fff;border:0;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.chip:hover{background:rgba(255,255,255,.35)}
main{max-width:1040px;margin:-38px auto 24px;padding:0 14px;display:grid;gap:16px}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 6px 24px rgba(120,60,20,.08);padding:20px}
h2{margin:0 0 12px;font-size:18px}h3{margin:18px 0 8px;font-size:15px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 5px}
input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:14px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border:0;border-radius:14px;background:var(--pri);color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.btn:hover{filter:brightness(1.06)}.btn.big{padding:15px 26px;font-size:17px;border-radius:16px}
.btn.sec{background:var(--soft);color:var(--ink)}.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}.btn.ghost{background:transparent;color:var(--muted)}.btn.danger{background:#fde8e8;color:#b91c1c}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.muted{color:var(--muted)}.small{font-size:13px}.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:#9a3412;white-space:nowrap;vertical-align:1px}
.pill.sale{background:var(--salebg);color:var(--sale)}.pill.stretch{background:#fef3c7;color:#92400e}.pill.d1{background:#e8f7ec;color:#166534}.pill.d2{background:#e0efff;color:#1e40af}.pill.d3{background:#f6e8ff;color:#7e22ce}
.note{border-radius:14px;padding:10px 14px;font-size:14px;margin-top:10px;background:var(--soft)}.note.ok{background:var(--okbg);color:#14532d}.note.warn{background:var(--warnbg);color:#7c4a03}
details>summary{cursor:pointer;font-weight:600;color:var(--pri);font-size:13px;list-style:none;margin-top:8px}details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";}details[open]>summary::before{content:"▾ "}
details.sec{border:1.5px solid var(--line);border-radius:16px;padding:4px 14px;margin:10px 0}details.sec>summary{font-size:15px;color:var(--ink);padding:10px 0;margin:0}
/* week bar */
.wbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.wbar>.f{flex:1;min-width:170px}
.wsel{display:flex;gap:6px}.wsel .btn{padding:0 14px}
.rec{margin-top:14px;padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,#fff3e0,#fef9c3);font-size:14px}
.rec b{font-size:16px}.rec ul{margin:6px 0 0;padding-left:18px;font-size:13px}
/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;margin:-4px -4px 14px;padding:4px}
.tabs button{flex:0 0 auto;border:0;background:var(--soft);padding:9px 16px;border-radius:999px;font:inherit;font-weight:700;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--pri);color:#fff}
/* plan */
.sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.sum span{background:var(--soft);border-radius:12px;padding:6px 12px;font-size:13px}.sum b{font-size:15px}
.grid7{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.day{border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;background:#fff}
.day .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}.day .hd b{font-size:16px}
.meal{display:flex;gap:8px;padding:7px 0;border-top:1px dashed var(--line);font-size:14px}.meal:first-of-type{border-top:0}
.meal .ic{width:22px;flex:0 0 22px;text-align:center}.meal .nm{flex:1}.meal .nm a{color:inherit;text-decoration:none;font-weight:600}.meal .nm a:hover{color:var(--pri)}
.meal .kc{font-size:12px;color:var(--muted);white-space:nowrap}
.tot{margin-top:8px;font-size:13px;font-weight:700;border-radius:10px;padding:6px 10px;text-align:center}.tot.good{background:var(--okbg);color:var(--ok)}.tot.off{background:var(--warnbg);color:#92400e}
/* grocery */
.gl{columns:2;column-gap:28px}@media(max-width:700px){.gl{columns:1}}
.gl section{break-inside:avoid;margin-bottom:16px}.gl h4{margin:0 0 6px;font-size:14px;color:var(--pri)}
.gl label.it{display:flex;gap:10px;align-items:center;font-weight:400;color:var(--ink);font-size:14px;margin:0;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer}
.gl label.it input{width:20px;height:20px;accent-color:var(--pri);flex:0 0 auto}.gl .q{color:var(--muted);font-size:13px;margin-left:auto;white-space:nowrap}.gl .done{text-decoration:line-through;opacity:.5}
/* prep */
.prep ol,.prep ul{padding-left:20px;margin:4px 0 10px}.prep li{margin:4px 0;font-size:14px}
.tip{background:#fff7e6;border-radius:12px;padding:8px 12px;font-size:14px;margin:6px 0}
.rc h4{margin:0 0 4px;font-size:15px}.rc p{margin:6px 0;font-size:14px}.rc .meta{font-size:13px;color:var(--muted)}
/* settings */
.set{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:800px){.set{grid-template-columns:1fr}}
.set .card{box-shadow:none;border:1.5px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.stat{background:var(--soft);border-radius:14px;padding:8px;text-align:center}.stat .k{font-size:11px;color:var(--muted);font-weight:700}.stat .v{font-size:17px;font-weight:800}
.level{font-size:26px;font-weight:800;color:var(--pri)}
.sp{max-height:300px;overflow:auto;margin-top:6px}.sp table{width:100%;border-collapse:collapse;font-size:13px}.sp td{padding:6px 4px;border-bottom:1px solid var(--line)}.sp td.pr{color:var(--sale);font-weight:700;white-space:nowrap}.sp tr.used td:first-child{font-weight:700}
table.hist{width:100%;border-collapse:collapse;font-size:14px}table.hist td,table.hist th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
/* modal / wizard */
.modal{position:fixed;inset:0;background:rgba(59,47,42,.45);display:flex;align-items:center;justify-content:center;z-index:9;padding:14px}
.modal .box{background:#fff;border-radius:24px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:24px}
.steps{display:flex;gap:6px;margin-bottom:16px}.steps i{flex:1;height:6px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--pri)}
.wz h2{font-size:22px;margin-bottom:4px}.wz .foot{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.q{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}.q .opts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.q .opts button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;cursor:pointer;font:inherit;font-size:14px}.q .opts button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tile{border:1.5px solid var(--line);border-radius:16px;background:#fff;padding:12px 8px;text-align:center;cursor:pointer;font:inherit;font-weight:600;font-size:14px}
.tile .e{display:block;font-size:26px;margin-bottom:4px}.tile.on{border-color:var(--pri);background:var(--soft)}.tile.rec{grid-column:1/-1;background:linear-gradient(135deg,#fff3e0,#fef9c3)}
.hidden{display:none!important}
.disc{font-size:12px;color:var(--muted);text-align:center;max-width:800px;margin:0 auto 24px;padding:0 16px}
@media(max-width:600px){header h1{font-size:20px}.card{padding:16px}.row3{grid-template-columns:1fr 1fr 1fr}.grid7{grid-template-columns:1fr}.wbar>.f{min-width:100%}.wbar>div:last-child{width:100%}.wbar .btn.big{width:100%}.stats{grid-template-columns:repeat(2,1fr)}.modal .box{padding:18px;border-radius:20px}}
@media print{header,.wbar,.tabs,.btn,.rec{display:none!important}main{margin:0}.card{box-shadow:none}}
/* ---- iPhone / touch ---- */
html{-webkit-text-size-adjust:100%}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
header{padding-top:calc(18px + env(safe-area-inset-top))}
input,select,textarea{font-size:16px;min-height:44px}
.btn,.chip,.tile,.q .opts button,.tabs button{min-height:44px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn.sm{min-height:40px}.btn.ghost{min-width:44px}
.meal .nm a{display:inline-block;padding:4px 0}
.ti{display:none}
@media(hover:none){.btn:hover,.chip:hover{filter:none}}
@media(max-width:700px){
  body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;margin:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);gap:2px;overflow:visible}
  .tabs button{background:transparent;border-radius:12px;padding:4px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:50px}
  .tabs button.on{background:var(--soft);color:var(--pri)}
  .ti{display:block;font-size:20px;line-height:1.1}
  .modal{align-items:flex-end;padding:0}
  .modal .box{border-radius:24px 24px 0 0;max-height:94vh;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  .wsel select{min-width:0}
}
</style></head><body>
<header><div class="wrap"><h1>🍊 FitPlan Meals</h1><div class="chips" id="chips"></div></div></header>
<main>
  <section class="card">
    <div class="wbar">
      <div class="f"><label for="weekSel">Week</label><div class="wsel"><button class="btn sec" id="wPrev" type="button" aria-label="Previous week">‹</button><select id="weekSel"></select><button class="btn sec" id="wNext" type="button" aria-label="Next week">›</button></div></div>
      <div class="f"><label for="cuisineSel">Cuisine</label><select id="cuisineSel"></select></div>
      <div><button class="btn big" id="gen" type="button">Make my week</button></div>
    </div>
    <div id="recBox"></div><div id="weekNotes"></div>
  </section>
  <section class="card">
    <div class="tabs" id="tabs"><button data-t="plan" class="on"><span class="ti">📅</span>Plan</button><button data-t="grocery"><span class="ti">🛒</span>Groceries</button><button data-t="prep"><span class="ti">🔪</span>Prep</button><button data-t="history"><span class="ti">🗂️</span>History</button><button data-t="settings"><span class="ti">⚙️</span>Settings</button></div>
    <div id="out"></div>
  </section>
</main>
<p class="disc">General guidance, not medical advice. Macros and sale prices are estimates. Check prices in store.</p>
<div id="modal" class="modal hidden"><div class="box" id="mbox"></div></div>

<script id="data">/* Recipe database. Macros are per serving (kcal, protein g, carbs g, fat g), estimates.
   meal: b = breakfast, m = main (lunch/dinner), s = snack. diff: 1 Beginner, 2 Intermediate, 3 Advanced.
   ingredients: "name;qty;unit;section" joined by |   sections: P produce, M meat/seafood, D dairy/eggs/deli, B bakery/tortillas, G pantry, F frozen */
const RAW = [];
function R(id, name, cuisine, meal, kcal, p, c, f, diff, active, total, tech, equip, ing, steps, tip) {
  RAW.push({ id, name, cuisine, meal, kcal, p, c, f, diff, active, total: total || active, tech: tech ? tech.split(',') : [], equip: equip ? equip.split(',') : [],
    ing: ing.split('|').map(s => { const [n, q, u, sec] = s.split(';'); return { n: n.trim(), q: +q, u, sec }; }), steps, tip: tip || '' });
}

/* ---------- Mexican ---------- */
R('mx1','Huevos rancheros with black beans','Mexican','b',430,24,40,19,1,15,15,'egg','pan','eggs;2;ea;D|corn tortillas;2;ea;B|black beans (canned);0.5;cup;G|salsa roja;0.25;cup;G|queso fresco;1;oz;D|avocado;0.25;ea;P','Warm tortillas and beans. Fry eggs to your liking. Top tortillas with beans, eggs, salsa, crumbled queso fresco and avocado.');
R('mx2','Egg, potato & pepper jack breakfast burritos','Mexican','b',480,28,48,19,1,20,25,'egg,dice','pan','eggs;2;ea;D|flour tortillas (10 in);1;ea;B|potato;0.5;ea;P|pepper jack;1;oz;D|onion;0.25;ea;P|salsa verde;2;tbsp;G','Dice potato and onion; pan-fry until tender (10 min). Add beaten eggs and scramble. Roll in tortillas with cheese and salsa. Wrap in foil — freezes well for the week.','Make 4 at once on prep day; reheat 60–90 s in the microwave.');
R('mx3','Chicken tinga rice bowls','Mexican','m',560,45,60,14,2,25,35,'chicken,simmer,rice,dice','pot,pan','chicken breast;6;oz;M|chipotle in adobo;1;tbsp;G|tomato;1;ea;P|onion;0.5;ea;P|garlic;1;clove;P|white rice;0.33;cup dry;G|black beans (canned);0.33;cup;G|lime;0.5;ea;P','Simmer chicken in salted water 15 min until 165°F, then shred. Blend tomato, chipotle, garlic. Sauté onion, add sauce and chicken, simmer 10 min. Serve over rice with beans and lime.');
R('mx4','Sirloin carne asada tacos','Mexican','m',540,42,45,20,2,20,25,'sear,dice','pan','sirloin tip steak;5;oz;M|corn tortillas;3;ea;B|onion;0.25;ea;P|cilantro;0.25;bunch;P|lime;1;ea;P|salsa verde;3;tbsp;G|garlic;1;clove;P','Rub steak with lime, garlic, salt and cumin (marinate 15 min+). Sear in a very hot pan 3–4 min per side, rest 5 min, slice thin against the grain. Serve in warm tortillas with diced onion, cilantro and salsa.');
R('mx5','Sheet-pan shrimp fajitas','Mexican','m',480,38,46,15,1,15,25,'roast,dice','sheet','shrimp (raw, peeled);6;oz;M|bell pepper;1;ea;P|onion;0.5;ea;P|flour tortillas (6 in);2;ea;B|avocado oil;1;tbsp;G|fajita seasoning;1;tsp;G|lime;0.5;ea;P','Slice peppers and onion; toss with oil and seasoning and roast at 425°F for 12 min. Add shrimp, roast 6–8 min more until pink. Squeeze lime and serve in tortillas.');
R('mx6','Pozole verde with chicken (Instant Pot)','Mexican','m',450,40,42,12,3,30,55,'pressure,blend,chicken,dice','pressure,blender','chicken thighs (boneless);5;oz;M|hominy (canned);0.75;cup;G|tomatillos;3;ea;P|anaheim chili;1;ea;P|onion;0.5;ea;P|garlic;2;clove;P|cabbage;0.5;cup;P|radishes;2;ea;P','Broil tomatillos, Anaheim chili and onion until charred; blend with garlic and 1 cup broth. Pressure cook chicken with sauce and hominy 15 min, natural release 10. Shred chicken, season, top with cabbage and radish.','Charring under the broiler adds big flavor — watch closely, it takes 4–6 min.');
R('mx7','Baked chicken milanesa with lime-crema salad','Mexican','m',520,46,40,18,2,20,30,'bake,chicken','oven,sheet','chicken breast milanesa (thin cutlets);6;oz;M|panko breadcrumbs;0.33;cup;G|eggs;0.5;ea;D|salad greens;2;cup;P|crema;1;tbsp;D|lime;0.5;ea;P|tomato;0.5;ea;P','Dip cutlets in egg then panko. Bake on an oiled sheet at 425°F 15–18 min, flipping once, to 165°F. Toss greens and tomato with crema thinned with lime juice.');
R('mx8','Papaya & Persian cucumber cup with Tajín + string cheese','Mexican','s',200,9,28,6,1,5,5,'dice','','papaya;1;cup;P|persian cucumbers;1;ea;P|lime;0.25;ea;P|Tajín;0.5;tsp;G|string cheese;1;ea;D','Cube papaya and cucumber, squeeze lime, sprinkle Tajín. Eat with a string cheese.');

/* ---------- Italian ---------- */
R('it1','Ricotta toast with strawberries & honey','Italian','b',380,22,42,13,1,5,5,'','','part-skim ricotta;0.5;cup;D|whole-grain bread;2;slice;B|strawberries;0.5;cup;P|honey;1;tsp;G','Toast bread, spread ricotta, top with sliced strawberries and a drizzle of honey.');
R('it2','Spinach & mushroom frittata','Italian','b',340,26,8,22,2,15,30,'egg,bake,dice','oven,pan','eggs;3;ea;D|spinach;1;cup;P|mushrooms;2;oz;P|parmesan;0.5;oz;D|olive oil;1;tsp;G','Sauté mushrooms and spinach in an oven-safe pan. Pour in beaten eggs with parmesan, cook 2 min on the stove, then bake at 375°F for 12–15 min until set. Cut into wedges for the week.');
R('it3','Turkey bolognese with whole-wheat pasta','Italian','m',620,45,70,16,2,25,40,'pasta,sauce,dice,simmer','pot,pan','ground turkey (93% lean);5;oz;M|whole-wheat pasta;2.5;oz;G|crushed tomatoes;0.5;cup;G|onion;0.33;ea;P|carrot;0.33;ea;P|garlic;1;clove;P|parmesan;0.33;oz;D','Sauté diced onion, carrot and garlic 5 min. Brown turkey. Add tomatoes and simmer 20 min. Boil pasta in well-salted water to al dente; toss with sauce and parmesan.');
R('it4','Chicken cacciatore','Italian','m',480,44,22,22,2,25,50,'sear,sauce,simmer,chicken,dice','pan','chicken thighs (boneless);6;oz;M|bell pepper;0.5;ea;P|mushrooms;2;oz;P|crushed tomatoes;0.5;cup;G|onion;0.33;ea;P|garlic;1;clove;P|olive oil;1;tsp;G|ciabatta;1;slice;B','Sear seasoned chicken until browned; remove. Sauté onion, pepper, mushrooms, garlic. Add tomatoes and chicken back, simmer covered 25 min to 165°F. Serve with ciabatta.');
R('it5','Lemon-garlic salmon, roasted broccoli & orzo','Italian','m',590,40,50,24,2,15,30,'fish,roast,pasta','sheet,pot','salmon fillet;5;oz;M|broccoli;1.5;cup;P|orzo;2;oz;G|lemon;0.5;ea;P|garlic;1;clove;P|olive oil;1;tsp;G','Toss broccoli with oil and roast at 425°F 10 min. Add salmon (lemon, garlic, salt) to the pan and roast 10–12 min until it flakes (145°F). Boil orzo; toss with lemon zest.');
R('it6','Pesto shrimp pasta with cherry tomatoes','Italian','m',600,40,62,20,1,20,20,'pasta','pot,pan','shrimp (raw, peeled);5;oz;M|pasta (spaghetti);2.5;oz;G|basil pesto;1.5;tbsp;G|cherry tomatoes;0.75;cup;P|garlic;1;clove;P','Boil pasta. Meanwhile sauté garlic and shrimp 3–4 min until pink. Toss pasta, shrimp, halved tomatoes and pesto with a splash of pasta water.');

R('it8','Caprese skewers with prosciutto','Italian','s',180,13,4,12,1,5,5,'','','fresh mozzarella;1;oz;D|cherry tomatoes;4;ea;P|prosciutto;0.5;oz;D|basil;4;leaf;P','Thread mozzarella, tomato, basil and folded prosciutto on toothpicks; drizzle balsamic.');

/* ---------- Mediterranean ---------- */

R('jp10','Chicken & vegetable udon soup','Japanese','m',520,40,62,10,1,15,20,'simmer,chicken','pot','chicken breast;4;oz;M|udon noodles (frozen);1;pack;F|dashi or chicken broth;2;cup;G|soy sauce;1;tbsp;G|mushrooms;2;oz;P|spinach;1;cup;P|scallions;1;ea;P|eggs;1;ea;D','Bring broth with soy to a simmer. Add thin-sliced chicken and mushrooms, 6 min. Add udon and spinach 2 min. Crack in an egg or add a soft-boiled half; top with scallions.');
R('kr9','Easy Korean ground beef rice bowls','Korean','m',600,38,62,20,1,15,15,'rice','pan,ricecooker','lean ground beef (90%);5;oz;M|soy sauce;1.5;tbsp;G|brown sugar;1;tsp;G|garlic;2;clove;P|ginger;0.5;inch;P|sesame oil;1;tsp;G|white rice;0.33;cup dry;G|persian cucumbers;1;ea;P|kimchi;0.25;cup;D','Brown beef with garlic and ginger. Stir in soy, brown sugar and sesame oil; simmer 2 min. Serve over rice with sliced cucumber and kimchi.');

R('it10','Mushroom & chicken risotto','Italian','m',590,42,62,18,3,40,45,'simmer,sauce,dice,chicken','pot,pan','chicken breast;4;oz;M|arborio rice;0.33;cup dry;G|mushrooms;3;oz;P|onion;0.25;ea;P|garlic;1;clove;P|chicken broth;1.5;cup;G|parmesan;0.5;oz;D|butter;1;tsp;D','Pan-cook diced chicken to 165°F; set aside. Sauté onion, garlic and mushrooms. Toast rice 2 min, then add hot broth one ladle at a time, stirring, letting each absorb (18–20 min) until creamy and al dente. Stir in butter, parmesan and chicken.','Keep the broth hot in a second pot and add it gradually — that slow absorption is what makes it creamy.');

R('me13','Baked kibbeh with yogurt-cucumber salad','Middle Eastern','m',600,40,55,24,3,45,85,'bake,dice','oven','lean ground beef (90%);5;oz;M|bulgur (#1 fine);0.33;cup;G|onion;0.5;ea;P|pine nuts;0.25;oz;G|7-spice (baharat);1;tsp;G|plain yogurt;0.5;cup;D|persian cucumbers;1;ea;P|olive oil;1;tsp;G','Soak bulgur 15 min, squeeze dry, knead with 2/3 of the beef, grated onion and spices. Brown the rest of the beef with onion and pine nuts for the filling. Press half the shell into a pan, add filling, top with remaining shell; score into diamonds, drizzle oil. Bake at 400°F 30–35 min. Serve with yogurt-cucumber salad.','Wet your hands to press the shell layer evenly — about ½ inch thick.');
R('jp11','Chicken katsu with shredded cabbage & rice','Japanese','m',640,46,70,18,3,35,40,'chicken,sear,rice','pan,ricecooker','chicken breast;6;oz;M|panko breadcrumbs;0.5;cup;G|eggs;0.5;ea;D|all-purpose flour;2;tbsp;G|avocado oil;1;tbsp;G|cabbage;1.5;cup;P|tonkatsu sauce;1;tbsp;G|white rice;0.33;cup dry;G','Butterfly and pound chicken to ½ inch. Dredge in flour, egg, then panko. Shallow-fry in ¼ inch oil over medium heat 4–5 min per side until golden and 165°F. Rest on a rack; slice. Serve with finely shredded cabbage, rice and tonkatsu sauce.','Medium heat, not high — the crust browns before the inside cooks if the oil is too hot. Use a thermometer.');

R('in10','Chicken dum biryani (layered rice)','Indian','m',650,45,75,18,3,45,90,'rice,marinate,sauce,dice,chicken','pot','chicken thighs (boneless);5;oz;M|basmati rice;0.33;cup dry;G|plain yogurt;0.33;cup;D|onion;0.75;ea;P|biryani masala;1;tbsp;G|ginger;0.5;inch;P|garlic;2;clove;P|mint;0.25;bunch;P|cilantro;0.25;bunch;P|butter;1;tsp;D','Marinate chicken in yogurt, spices, ginger and garlic 1 h+. Fry sliced onions until deep golden. Par-boil soaked rice in salted water 5 min (70% done). Cook chicken in a heavy pot 10 min, layer onions, herbs and rice, dot with butter, seal tightly and cook on lowest heat 25 min. Fluff gently.','Par-cook the rice only until it breaks with some resistance — it finishes in the steam.');

<script>/* ===== UI ===== */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const KEY = 'fitplan.meals.v1';
const RECIPES = RAW; const BY = Object.fromEntries(RECIPES.map(r => [r.id, r]));
const EMOJI = { Mexican: '🌮', Italian: '🍝', Mediterranean: '🫒', 'Middle Eastern': '🧆', Armenian: '🍇', 'Latin American': '🫓', Japanese: '🍱', Korean: '🥘', Thai: '🥥', Indian: '🍛', Chinese: '🥟', Vietnamese: '🍜', American: '🍔' };
const SLOT_IC = { Breakfast: '☀️', Lunch: '🥗', Dinner: '🍽️', Snack: '🍎' };
const STORES = {
  'superking-culvercity': { name: 'Super King', full: 'Super King Markets', city: 'Culver City, CA', addr: '5587 Sepulveda Blvd · 7am–9pm', family: 'superking', ad: 'https://www.superkingmarkets.com/weekly-ad' },
  'heb-austin': { name: 'H-E-B', full: 'H-E-B', city: 'Austin, TX', family: 'heb', ad: 'https://www.heb.com/weekly-ad' },
  'centralmarket-austin': { name: 'Central Market', full: 'Central Market', city: 'Austin, TX', family: 'centralmarket', ad: 'https://www.centralmarket.com' },
  'wholefoods-austin': { name: 'Whole Foods', full: 'Whole Foods Market', city: 'Austin, TX', family: 'wholefoods', ad: 'https://www.wholefoodsmarket.com/sales-flyer' },
  'custom': { name: 'Other', full: 'Other store', city: '', family: 'custom' },
};
const today = iso(new Date());
const fresh = () => ({ v: 1, onboarded: false, targets: { kcal: 2100, protein: 160, fatPct: 30, src: 'default' }, skill: { answers: {}, taken: false, quizLevel: 1, known: [], override: 'auto', stretch: true },
  store: { id: 'superking-culvercity', customName: '', customCity: '' }, specials: { 'superking-culvercity': JSON.parse(JSON.stringify(SK_SPECIALS)) }, weeks: {}, cur: defaultWeek(today), checks: {}, draft: {} });
let S; try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {} if (!S || S.v !== 1) S = fresh();
if (S.onboarded == null) S.onboarded = !!S.skill.taken;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
let tab = 'plan';

const level = () => S.skill.override !== 'auto' ? +S.skill.override : (S.skill.taken ? S.skill.quizLevel : 1);
const targets = () => macroTargets(S.targets);
const store = () => S.store.id === 'custom' ? { ...STORES.custom, name: S.store.customName || 'Other store', full: S.store.customName || 'Other store', city: S.store.customCity } : STORES[S.store.id];
const spAll = () => S.specials[S.store.id] || null;
const week = () => S.weeks[S.cur] || null;
const shopDate = () => (week() && week().shop) || (S.draft[S.cur] && S.draft[S.cur].shop) || addDays(S.cur, -1);
const spActive = () => specialsActive(spAll(), shopDate()) ? spAll() : null;
const fmtD = (s, o) => parseISO(s).toLocaleDateString(undefined, o || { month: 'short', day: 'numeric' });
const dl = d => `<span class="pill d${d}">${LEVELS[d]}</span>`;
const short = n => n.split(/ or | \(|, | \d/)[0];
function setTab(t) { tab = t; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x.dataset.t === t)); renderOut(); window.scrollTo({ top: 0 }); }

/* ---------- header chips ---------- */
function renderChips() {
  const t = targets();
  $('chips').innerHTML = `<button class="chip" data-go="targets">${t.kcal} kcal · ${t.p} g protein</button><button class="chip" data-go="skill">👩‍🍳 ${LEVELS[level()]}</button><button class="chip" data-go="store">🛒 ${esc(store().name)}</button>`;
  $('chips').querySelectorAll('[data-go]').forEach(b => b.onclick = () => { setTab('settings'); const el = $('set-' + b.dataset.go); if (el) el.scrollIntoView({ behavior: 'smooth' }); });
}

/* ---------- recommendation ---------- */
function computeRec() {
  const h = { ...S.weeks }; delete h[S.cur];
  const r = recommendCuisine({ recipes: RECIPES, history: h, weekISO: S.cur, targets: targets(), level: level(), specials: spActive(), storeFamily: store().family });
  const b = r.ranked[0];
  const bits = [`${Math.round(b.pPct * 100)}% protein`]; if (b.sale.length) bits.push(`${b.sale.length} deals`); if (r.recent.length) bits.push(`new vs. last ${r.recent.length} wk`);
  return { cuisine: r.cuisine, reasons: r.reasons, line: bits.join(' · '), runnerUp: r.ranked.slice(1, 4).map(x => x.cuisine) };
}

/* ---------- week bar ---------- */
function renderWeekBar() {
  const list = [...new Set([...Object.keys(S.weeks), S.cur, defaultWeek(today), mondayOf(today)])].sort();
  $('weekSel').innerHTML = list.map(w => `<option value="${w}">${fmtD(w)}–${fmtD(addDays(w, 6), { day: 'numeric' })}${S.weeks[w] ? ' · ' + esc(S.weeks[w].cuisine) : ''}</option>`).join('');
  $('weekSel').value = S.cur;
  const w = week(), dr = S.draft[S.cur] || {};
  const pick = dr.pick || (w ? (w.mode === 'rec' ? '__rec' : w.cuisine) : '__rec');
  $('cuisineSel').innerHTML = `<option value="__rec">✨ Surprise me</option>` + CUISINES.map(c => `<option value="${c}">${EMOJI[c]} ${c}</option>`).join('');
  $('cuisineSel').value = pick;
  $('gen').textContent = w ? '↻ Remake week' : 'Make my week';
  const rec = pick === '__rec' ? (w && w.mode === 'rec' && !dr.pick ? w.rec : computeRec()) : null;
  $('recBox').innerHTML = rec ? `<div class="rec">✨ <b>${EMOJI[rec.cuisine] || ''} ${esc(rec.cuisine)}</b> <span class="muted small">${esc(rec.line || '')}</span>
    <details><summary>Why?</summary><ul>${rec.reasons.map(r => `<li>${esc(r)}</li>`).join('')}</ul></details></div>` : '';
  let notes = '';
  if (w && w.plan.notes.length) notes += `<div class="note small">${w.plan.notes.map(esc).join('<br>')}</div>`;
  if (w && (w.plan.targets.kcal !== targets().kcal || w.plan.targets.p !== targets().p || w.plan.level !== level())) notes += `<div class="note warn small">Targets or level changed. Tap “Remake week” to update.</div>`;
  $('weekNotes').innerHTML = notes;
}
$('weekSel').addEventListener('change', e => { S.cur = e.target.value; save(); renderAll(); });
$('wPrev').addEventListener('click', () => { S.cur = addDays(S.cur, -7); save(); renderAll(); });
$('wNext').addEventListener('click', () => { S.cur = addDays(S.cur, 7); save(); renderAll(); });
$('cuisineSel').addEventListener('change', e => { (S.draft[S.cur] = S.draft[S.cur] || {}).pick = e.target.value; save(); renderWeekBar(); });
function build(pick, shuffle) {
  let cuisine = pick, rec = null;
  if (pick === '__rec') { rec = computeRec(); cuisine = rec.cuisine; }
  const prev = week(); const seed = shuffle ? String(Date.now()) : (prev && prev.cuisine === cuisine ? prev.plan.seed : '');
  const plan = buildWeekPlan({ recipes: RECIPES, cuisine, weekISO: S.cur, targets: targets(), level: level(), known: S.skill.known, stretch: S.skill.stretch, specials: spActive(), seed });
  S.weeks[S.cur] = { cuisine, mode: pick === '__rec' ? 'rec' : 'pick', rec, plan, shop: shopDate(), store: store().full, specialsUsed: !!spActive() };
  if (S.draft[S.cur]) delete S.draft[S.cur].pick;
  save();
}
$('gen').addEventListener('click', () => { const w = week(); const pick = $('cuisineSel').value; const same = w && (pick === '__rec' ? w.mode === 'rec' : w.cuisine === pick); build(pick, !!same); setTab('plan'); renderAll(); });
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setTab(b.dataset.t); });

/* ---------- outputs ---------- */
function badges(r, p, sp) { const s = saleHits(r, sp); return `${r.id === p.stretchId ? ' <span class="pill stretch">⭐</span>' : ''}${s.length ? ` <span class="pill sale" title="On sale: ${esc(s.map(short).join(', '))}">🏷 ${s.length}</span>` : ''}`; }
function renderOut() {
  if (tab === 'history') return renderHistory();
  if (tab === 'settings') return renderSettings();
  const w = week();
  if (!w) { $('out').innerHTML = `<div style="text-align:center;padding:30px 10px"><div style="font-size:40px">🍳</div><p><b>No plan for ${fmtD(S.cur)} yet.</b></p><button class="btn big" type="button" id="emptyGo">Make my week</button></div>`; $('emptyGo').onclick = () => $('gen').click(); return; }
  const p = w.plan, sp = specialsActive(spAll(), w.shop) ? spAll() : null;
  if (tab === 'plan') {
    const avg = k => Math.round(p.days.reduce((s, d) => s + d.tot[k], 0) / 7);
    $('out').innerHTML = `<div class="sum"><span>${EMOJI[w.cuisine] || ''} <b>${esc(w.cuisine)}</b></span><span>avg <b>${avg('kcal')}</b> / ${p.targets.kcal} kcal</span><span><b>${avg('p')}</b> g protein</span><span>${LEVELS[p.level]}</span></div>
    <div class="grid7">${p.days.map(d => { const ok = Math.abs(d.tot.kcal - p.targets.kcal) / p.targets.kcal <= 0.05 && d.tot.p >= p.targets.p * 0.95;
      return `<div class="day"><div class="hd"><b>${d.day}</b><span class="muted small">${fmtD(d.date)}</span></div>${d.meals.map(m => { const r = BY[m.id]; return `<div class="meal"><span class="ic" title="${m.slot}">${SLOT_IC[m.slot]}</span><span class="nm"><a href="#" data-r="${r.id}">${esc(r.name)}</a>${badges(r, p, sp)}</span><span class="kc">${Math.round(r.kcal * m.sv)}${m.sv !== 1 ? `<br>${m.sv}×` : ''}</span></div>`; }).join('')}
      <div class="tot ${ok ? 'good' : 'off'}">${d.tot.kcal} kcal · ${d.tot.p} g P</div></div>`; }).join('')}</div>
    <details><summary>How this works</summary><p class="hint">Lunches are batch-cooked (Mon–Wed, Thu–Sat). Dinners make leftovers. 🏷 = uses sale items · ⭐ = stretch recipe · green = on target. Tap a dish for the recipe.</p></details>`;
    $('out').querySelectorAll('[data-r]').forEach(a => a.onclick = e => { e.preventDefault(); showRecipe(a.dataset.r, p); });
  } else if (tab === 'grocery') {
    const g = groceryList(p, RECIPES, sp); const ck = S.checks[S.cur] = S.checks[S.cur] || {};
    const nSale = Object.values(g).flat().filter(x => x.special).length;
    $('out').innerHTML = `<div class="sum"><span>🛒 <b>${esc(w.store || store().full)}</b></span><span>${fmtD(w.shop, { weekday: 'short', month: 'short', day: 'numeric' })}</span>${nSale ? `<span class="pill sale" style="padding:6px 12px">🏷 ${nSale} on sale</span>` : ''}<button class="btn sm sec" id="glCopy" type="button">Copy</button></div>
    <div class="gl">${Object.keys(SECTIONS).filter(s => g[s]).map(s => `<section><h4>${SECTIONS[s]}</h4>${g[s].map(x => { const k = x.n + '|' + x.u; return `<label class="it"><input type="checkbox" data-k="${esc(k)}" ${ck[k] ? 'checked' : ''}><span class="${ck[k] ? 'done' : ''}">${esc(x.n)}${x.special ? ` <span class="pill sale" title="${esc(x.special.name)}">${esc(x.special.price)}</span>` : ''}</span><span class="q">${esc(x.qty)}</span></label>`; }).join('')}</section>`).join('')}</div>`;
    $('out').querySelectorAll('input[type=checkbox]').forEach(c => c.onchange = () => { ck[c.dataset.k] = c.checked; save(); c.nextElementSibling.classList.toggle('done', c.checked); });
    $('glCopy').onclick = e => { const txt = Object.keys(SECTIONS).filter(s => g[s]).map(s => SECTIONS[s].toUpperCase() + '\n' + g[s].map(x => `- ${x.n}, ${x.qty}${x.special ? ' [SALE ' + x.special.price + ']' : ''}`).join('\n')).join('\n\n'); navigator.clipboard && navigator.clipboard.writeText(txt).catch(() => {}); e.target.textContent = 'Copied ✓'; };
  } else if (tab === 'prep') {
    const pg = prepGuide(p, RECIPES, { level: p.level, known: S.skill.known });
    $('out').innerHTML = `<div class="prep">
      <h3>🧺 ${fmtD(addDays(p.weekISO, -1), { weekday: 'long' })} prep</h3><ul>${pg.prepDay.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
      <h3>🍳 Cook days</h3><ul>${pg.cook.map(c => `<li><b>${fmtD(c.when, { weekday: 'short' })}</b> · ${esc(c.name)} ×${c.sv}${c.id === p.stretchId ? ' <span class="pill stretch">⭐ stretch</span>' : ''}</li>`).join('')}</ul>
      ${pg.stretch ? `<details class="sec" open><summary>⭐ Stretch: ${esc(pg.stretch.name)}</summary>${pg.stretch.tip ? `<div class="tip">${esc(pg.stretch.tip)}</div>` : ''}${pg.stretch.techs.map(t => `<div class="tip"><b>${esc(t.label)}</b>: ${esc(t.tip)}</div>`).join('')}</details>` : ''}
      ${pg.tips.length ? `<details class="sec"${p.level === 1 ? ' open' : ''}><summary>💡 ${p.level === 1 ? 'Beginner tips' : 'Skill tips'} (${pg.tips.length})</summary>${pg.tips.map(t => `<div class="tip"><b>${esc(t.label)}</b>: ${esc(t.tip)}</div>`).join('')}</details>` : ''}
      <details class="sec"><summary>🌡️ Food safety</summary><ul>${pg.safety.map(x => `<li>${esc(x)}</li>`).join('')}</ul></details>
      <h3>📖 Recipes</h3>${pg.recipes.map(r => `<details class="sec rc"><summary>${esc(r.name)} ${dl(r.diff)}${r.id === p.stretchId ? ' <span class="pill stretch">⭐</span>' : ''}</summary>${recipeBody(r)}</details>`).join('')}</div>`;
  }
}
function recipeBody(r) {
  const w = week(), sp = w && specialsActive(spAll(), w.shop) ? spAll() : null, sale = saleHits(r, sp);
  return `${sale.length ? `<div class="note small" style="background:var(--salebg);color:var(--sale)">🏷 On sale: ${esc(sale.map(short).join(', '))}</div>` : ''}<div class="meta">⏱ ${r.active} min${r.total > r.active ? ` (${r.total} total)` : ''} · ${r.kcal} kcal · ${r.p}P ${r.c}C ${r.f}F per serving</div>
  <p><b>You need:</b> ${r.ing.map(i => `${esc(i.n)} ${i.q} ${esc(i.u)}`).join(' · ')}</p><p>${esc(r.steps)}</p>${r.tip ? `<div class="tip">💡 ${esc(r.tip)}</div>` : ''}
  <details><summary>Techniques & equipment</summary><p class="hint">${r.tech.map(t => TECH[t] ? TECH[t].label : t).join(', ') || 'None'}${r.equip.length ? ' · ' + r.equip.join(', ') : ''}</p></details>`;
}
function showRecipe(id, p) { const r = BY[id]; openModal(`<h2>${esc(r.name)} ${dl(r.diff)}${r.id === p.stretchId ? ' <span class="pill stretch">⭐ stretch</span>' : ''}</h2>${recipeBody(r)}<div style="text-align:right;margin-top:14px"><button class="btn" type="button" id="mClose">Done</button></div>`); $('mClose').onclick = closeModal; }
function renderHistory() {
  const ws = Object.keys(S.weeks).sort().reverse();
  if (!ws.length) { $('out').innerHTML = '<p class="muted">No saved weeks yet.</p>'; return; }
  $('out').innerHTML = `<table class="hist"><tr><th>Week</th><th>Cuisine</th><th>Avg</th><th></th></tr>${ws.map(w => { const x = S.weeks[w], d = x.plan.days; const a = k => Math.round(d.reduce((s, y) => s + y.tot[k], 0) / 7);
    return `<tr><td><a href="#" data-go="${w}">${fmtD(w)}</a></td><td>${EMOJI[x.cuisine] || ''} ${esc(x.cuisine)}${x.mode === 'rec' ? ' ✨' : ''}</td><td class="small">${a('kcal')} kcal · ${a('p')} g</td><td><button class="btn sm ghost" data-rm="${w}" type="button" aria-label="Delete week">🗑</button></td></tr>`; }).join('')}</table>`;
  $('out').querySelectorAll('[data-go]').forEach(a => a.onclick = e => { e.preventDefault(); S.cur = a.dataset.go; save(); setTab('plan'); renderAll(); });
  $('out').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { if (confirm('Delete this week?')) { delete S.weeks[b.dataset.rm]; save(); renderAll(); } });
}

/* ---------- settings ---------- */
function targetsForm(pre) {
  const t = targets();
  return `<div class="row3"><div><label for="${pre}K">Calories</label><input id="${pre}K" type="number" inputmode="numeric" value="${S.targets.kcal}"></div><div><label for="${pre}P">Protein g</label><input id="${pre}P" type="number" inputmode="numeric" value="${S.targets.protein}"></div><div><label for="${pre}F">Fat %</label><input id="${pre}F" type="number" inputmode="numeric" value="${S.targets.fatPct}"></div></div>
  <div class="stats"><div class="stat"><div class="k">KCAL</div><div class="v">${t.kcal}</div></div><div class="stat"><div class="k">PROTEIN</div><div class="v">${t.p}g</div></div><div class="stat"><div class="k">CARBS</div><div class="v">${t.c}g</div></div><div class="stat"><div class="k">FAT</div><div class="v">${t.f}g</div></div></div>
  <button class="btn sm sec" style="margin-top:12px" type="button" id="${pre}Fp">↧ Import from FitPlan</button>${S.targets.src === 'FitPlan' ? ' <span class="pill">from FitPlan</span>' : ''}`;
}
function bindTargets(pre, after) {
  ['K', 'P', 'F'].forEach(k => $(pre + k).addEventListener('change', () => { S.targets = { kcal: +$(pre + 'K').value || 2000, protein: +$(pre + 'P').value || 120, fatPct: Math.min(45, Math.max(15, +$(pre + 'F').value || 30)), src: 'manual' }; save(); after(); }));
  $(pre + 'Fp').onclick = () => { let o = null; try { o = JSON.parse(localStorage.getItem('fitplan.v1')); } catch (e) {} const t = fitplanTargets(o);
    if (!t) { alert('No FitPlan data in this browser yet. Build a plan in FitPlan first.'); return; } S.targets = { kcal: t.kcal, protein: t.protein, fatPct: S.targets.fatPct, src: 'FitPlan' }; save(); after(); };
}
function storeForm(pre) {
  const st = store();
  return `<select id="${pre}Store">${Object.entries(STORES).map(([k, v]) => `<option value="${k}">${esc(v.full)}${v.city ? ' · ' + esc(v.city) : ''}</option>`).join('')}</select>
  <div class="row ${S.store.id === 'custom' ? '' : 'hidden'}"><div><label for="${pre}Cn">Name</label><input id="${pre}Cn" value="${esc(S.store.customName)}"></div><div><label for="${pre}Cc">City</label><input id="${pre}Cc" value="${esc(S.store.customCity)}"></div></div>
  <p class="hint">${st.addr ? esc(st.addr) + ' · ' : ''}${st.ad ? `<a href="${st.ad}" target="_blank" rel="noopener">weekly ad</a>` : ''}</p>`;
}
function bindStore(pre, after) {
  $(pre + 'Store').value = S.store.id;
  $(pre + 'Store').onchange = e => { S.store.id = e.target.value; save(); after(); };
  [pre + 'Cn', pre + 'Cc'].forEach(id => $(id).onchange = () => { S.store.customName = $(pre + 'Cn').value.trim(); S.store.customCity = $(pre + 'Cc').value.trim(); save(); after(); });
}
function renderSettings() {
  const sk = S.skill, sp = spAll(), n = sp && sp.items ? sp.items.length : 0, act = specialsActive(sp, shopDate());
  const usedNames = new Set(); const w = week(); if (w && n) Object.values(groceryList(w.plan, RECIPES, sp)).flat().forEach(x => x.special && usedNames.add(x.special.name));
  const secOrder = Object.keys(SECTIONS);
  const items = n ? [...sp.items].map((it, i) => ({ ...it, i })).sort((a, b) => (usedNames.has(b.name) - usedNames.has(a.name)) || secOrder.indexOf(a.sec) - secOrder.indexOf(b.sec)) : [];
  $('out').innerHTML = `<div class="set">
   <div class="card" id="set-targets"><h2>🎯 Daily targets</h2>${targetsForm('st')}</div>
   <div class="card" id="set-skill"><h2>👩‍🍳 Cooking level</h2><div class="level">${LEVELS[level()]}</div>
     <p class="hint">${sk.taken ? `Quiz ${sk.score}/${sk.max}${sk.override !== 'auto' ? ' · set manually' : ''}` : 'Quiz not taken yet'}</p>
     <div class="row"><div><label for="lvlOv">Level</label><select id="lvlOv"><option value="auto">From quiz</option><option value="1">Beginner</option><option value="2">Intermediate</option><option value="3">Advanced</option></select></div>
     <div><label for="stretch">Stretch recipe</label><select id="stretch"><option value="1">1 per week</option><option value="0">Off</option></select></div></div>
     <button class="btn sm sec" style="margin-top:12px" type="button" id="retake">${sk.taken ? 'Retake quiz' : 'Take quiz'}</button></div>
   <div class="card" id="set-store"><h2>🛒 Store</h2>${storeForm('st')}
     <label for="shopDate">Shopping day</label><input id="shopDate" type="date" value="${shopDate()}"></div>
   <div class="card" id="set-specials"><h2>🏷 Deals <span class="pill sale">${n || 'none'}</span></h2>
     ${n ? `<div class="note ${act ? 'ok' : 'warn'} small">${act ? '✓ ' : ''}Valid ${sp.validFrom ? fmtD(sp.validFrom) + '–' + fmtD(sp.validTo) : '(no dates)'}${act ? '' : ' · not valid on your shopping day'}</div>` : `<p class="hint">No deals for this store yet. Add some below.</p>`}
     ${n ? `<details><summary>See all ${n} deals</summary><div class="sp"><table>${items.map(it => `<tr class="${usedNames.has(it.name) ? 'used' : ''}"><td>${usedNames.has(it.name) ? '✓ ' : ''}${esc(it.name)}</td><td class="pr">${esc(it.price)}</td><td><button class="btn sm ghost" data-del="${it.i}" type="button" aria-label="Remove">✕</button></td></tr>`).join('')}</table></div>${sp.source ? `<p class="hint">Source: <a href="${esc(sp.source)}" target="_blank" rel="noopener">store ad</a>${sp.fetched ? ', ' + fmtD(sp.fetched) : ''}</p>` : ''}</details>` : ''}
     <details><summary>Edit deals</summary>
       <div class="row"><div><label for="spFrom">From</label><input id="spFrom" type="date" value="${(sp && sp.validFrom) || ''}"></div><div><label for="spTo">To</label><input id="spTo" type="date" value="${(sp && sp.validTo) || ''}"></div></div>
       <label for="spPaste">Add: item | price | match words</label><textarea id="spPaste" rows="3" placeholder="Chicken thighs | $1.99 lb | chicken thigh"></textarea>
       <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn sm" id="spAdd" type="button">Add</button>${S.store.id === 'superking-culvercity' ? '<button class="btn sm sec" id="spReset" type="button">Restore ad</button>' : ''}<button class="btn sm danger" id="spClear" type="button">Clear</button></div></details></div>
  </div>`;
  const re = () => { renderAll(); };
  bindTargets('st', re); bindStore('st', re);
  $('lvlOv').value = sk.override; $('stretch').value = sk.stretch ? '1' : '0';
  $('lvlOv').onchange = e => { S.skill.override = e.target.value; save(); re(); };
  $('stretch').onchange = e => { S.skill.stretch = e.target.value === '1'; save(); re(); };
  $('retake').onclick = () => openQuiz(false);
  $('shopDate').onchange = e => { (S.draft[S.cur] = S.draft[S.cur] || {}).shop = e.target.value; if (week()) week().shop = e.target.value; save(); re(); };
  const ensureSp = () => S.specials[S.store.id] || (S.specials[S.store.id] = { store: S.store.id, validFrom: '', validTo: '', source: '', items: [] });
  $('out').querySelectorAll('[data-del]').forEach(b => b.onclick = () => { sp.items.splice(+b.dataset.del, 1); save(); re(); });
  $('spFrom').onchange = e => { ensureSp().validFrom = e.target.value; save(); re(); };
  $('spTo').onchange = e => { ensureSp().validTo = e.target.value; save(); re(); };
  $('spAdd').onclick = () => { const s = ensureSp(); $('spPaste').value.split('\n').map(l => l.trim()).filter(Boolean).forEach(l => { const [name, price, kw] = l.split('|').map(x => (x || '').trim()); if (name) s.items.push({ name, price: price || '', sec: 'G', kw: (kw || name).toLowerCase().split(',').map(x => x.trim()).filter(Boolean) }); }); save(); re(); };
  if ($('spReset')) $('spReset').onclick = () => { S.specials['superking-culvercity'] = JSON.parse(JSON.stringify(SK_SPECIALS)); save(); re(); };
  $('spClear').onclick = () => { if (confirm('Remove all deals for this store?')) { ensureSp().items = []; save(); re(); } };
}

/* ---------- modal, quiz & onboarding wizard ---------- */
function openModal(html) { $('mbox').innerHTML = html; $('modal').classList.remove('hidden'); document.body.style.overflow = 'hidden'; }
function closeModal() { $('modal').classList.add('hidden'); document.body.style.overflow = ''; }
$('modal').addEventListener('click', e => { if (e.target.id === 'modal' && S.onboarded) closeModal(); });
const stepBar = n => `<div class="steps">${[1, 2, 3, 4].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</div>`;
function quizHTML(ans) { return QUIZ.map(q => `<div class="q"><div>${esc(q.short || q.q)}</div><div class="opts">${(q.opts || [['Yes', 'yes'], ['No', 'no']]).map(([l, v]) => `<button type="button" data-q="${q.id}" data-v="${v}" class="${String(ans[q.id]) === String(v) ? 'on' : ''}">${l}</button>`).join('')}</div></div>`).join(''); }
function openQuiz(wizard) {
  const ans = { ...S.skill.answers };
  const draw = () => {
    const done = QUIZ.filter(q => ans[q.id] != null).length;
    openModal(`<div class="wz">${wizard ? stepBar(1) : ''}<h2>Can you…?</h2><p class="hint">${done}/${QUIZ.length} answered</p>${quizHTML(ans)}
      <div class="foot">${wizard ? '<span></span>' : '<button class="btn sec" id="qCancel" type="button">Cancel</button>'}<button class="btn big" id="qDone" type="button" ${done < QUIZ.length ? 'disabled style="opacity:.5"' : ''}>${wizard ? 'Next' : 'Save'}</button></div></div>`);
    $('mbox').querySelectorAll('.opts button').forEach(b => b.onclick = () => { ans[b.dataset.q] = b.dataset.v; const y = $('mbox').scrollTop; draw(); $('mbox').scrollTop = y; });
    if ($('qCancel')) $('qCancel').onclick = closeModal;
    $('qDone').onclick = () => { if (QUIZ.some(q => ans[q.id] == null)) return; const r = scoreQuiz(ans); Object.assign(S.skill, { answers: ans, taken: true, quizLevel: r.level, known: r.known, score: r.score, max: r.max }); save();
      if (wizard) wzProfile(); else { closeModal(); renderAll(); } };
  };
  draw();
}
function wzProfile() {
  const draw = () => {
    openModal(`<div class="wz">${stepBar(2)}<h2>You're ${/^[AEIOU]/.test(LEVELS[level()]) ? 'an' : 'a'} ${LEVELS[level()]} cook 👩‍🍳</h2><p class="hint">Now your daily targets and store.</p>
      ${targetsForm('wz')}<label for="wzStore">Store</label>${storeForm('wz')}
      <div class="foot"><button class="btn sec" id="wzBack" type="button">Back</button><button class="btn big" id="wzNext" type="button">Next</button></div></div>`);
    bindTargets('wz', draw); bindStore('wz', draw);
    $('wzBack').onclick = () => openQuiz(true); $('wzNext').onclick = wzCuisine;
  };
  draw();
}
function wzCuisine() {
  const rec = computeRec(); let pick = '__rec';
  const draw = () => {
    openModal(`<div class="wz">${stepBar(3)}<h2>What sounds good this week?</h2><p class="hint">Pick one, or let us choose.</p>
      <div class="tiles"><button class="tile rec ${pick === '__rec' ? 'on' : ''}" data-c="__rec" type="button"><span class="e">✨</span>Surprise me: <b>${esc(rec.cuisine)}</b><br><span class="small muted">${esc(rec.line)}</span></button>
      ${CUISINES.map(c => `<button class="tile ${pick === c ? 'on' : ''}" data-c="${c}" type="button"><span class="e">${EMOJI[c]}</span>${c}</button>`).join('')}</div>
      <div class="foot"><button class="btn sec" id="wzBack" type="button">Back</button><button class="btn big" id="wzNext" type="button">Make my week</button></div></div>`);
    $('mbox').querySelectorAll('[data-c]').forEach(b => b.onclick = () => { pick = b.dataset.c; draw(); });
    $('wzBack').onclick = wzProfile; $('wzNext').onclick = () => { build(pick, false); wzDone(); };
  };
  draw();
}
function wzDone() {
  const w = week(); const d = w.plan.days; const a = k => Math.round(d.reduce((s, y) => s + y.tot[k], 0) / 7);
  const nSale = Object.values(groceryList(w.plan, RECIPES, spActive())).flat().filter(x => x.special).length;
  openModal(`<div class="wz" style="text-align:center">${stepBar(4)}<div style="font-size:48px">${EMOJI[w.cuisine] || '🎉'}</div><h2>Your ${esc(w.cuisine)} week is ready</h2>
    <p class="muted">~${a('kcal')} kcal · ${a('p')} g protein a day${nSale ? ` · ${nSale} items on sale` : ''}</p>
    <div class="foot" style="justify-content:center"><button class="btn big" id="wzGo" type="button">See my plan</button></div></div>`);
  $('wzGo').onclick = () => { S.onboarded = true; save(); closeModal(); setTab('plan'); renderAll(); };
}

function renderAll() { renderChips(); renderWeekBar(); renderOut(); }
renderAll();
if (!S.onboarded && !/demo/.test(location.hash)) openQuiz(true);
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
</script>
