<html lang="en"><head><meta charset="UTF-8">

<title>Chef Momo</title><style>:root{--bg:#fff8f1;--card:#fff;--ink:#3b2f2a;--muted:#8a7a70;--line:#f1e4d8;--pri:#ea580c;--pri2:#f59e0b;--soft:#fff1e6;--ok:#15803d;--okbg:#e8f7ec;--warnbg:#fff4d6;--sale:#e11d48;--salebg:#ffe4ea;--r:20px}
*{box-sizing:border-box}
body{margin:0;font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);line-height:1.45;font-size:15px}
a{color:var(--pri)}
header{background:linear-gradient(135deg,#fb923c,#f59e0b);color:#fff;padding:18px 16px 54px}
header .wrap{max-width:1040px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header h1{margin:0;font-size:24px;letter-spacing:-.3px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.22);color:#fff;border:0;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.chip:hover{background:rgba(255,255,255,.35)}
main{max-width:1040px;margin:-38px auto 24px;padding:0 14px;display:grid;gap:16px}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 6px 24px rgba(120,60,20,.08);padding:20px}
h2{margin:0 0 12px;font-size:18px}h3{margin:18px 0 8px;font-size:15px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 5px}
input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:14px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border:0;border-radius:14px;background:var(--pri);color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.btn:hover{filter:brightness(1.06)}.btn.big{padding:15px 26px;font-size:17px;border-radius:16px}
.btn.sec{background:var(--soft);color:var(--ink)}.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}.btn.ghost{background:transparent;color:var(--muted)}.btn.danger{background:#fde8e8;color:#b91c1c}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.muted{color:var(--muted)}.small{font-size:13px}.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:#9a3412;white-space:nowrap;vertical-align:1px}
.pill.sale{background:var(--salebg);color:var(--sale)}.pill.stretch{background:#fef3c7;color:#92400e}.pill.d1{background:#e8f7ec;color:#166534}.pill.d2{background:#e0efff;color:#1e40af}.pill.d3{background:#f6e8ff;color:#7e22ce}
.note{border-radius:14px;padding:10px 14px;font-size:14px;margin-top:10px;background:var(--soft)}.note.ok{background:var(--okbg);color:#14532d}.note.warn{background:var(--warnbg);color:#7c4a03}
details>summary{cursor:pointer;font-weight:600;color:var(--pri);font-size:13px;list-style:none;margin-top:8px}details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";}details[open]>summary::before{content:"▾ "}
details.sec{border:1.5px solid var(--line);border-radius:16px;padding:4px 14px;margin:10px 0}details.sec>summary{font-size:15px;color:var(--ink);padding:10px 0;margin:0}
/* week bar */
.wbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.wbar>.f{flex:1;min-width:170px}
.wsel{display:flex;gap:6px}.wsel .btn{padding:0 14px}
.rec{margin-top:14px;padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,#fff3e0,#fef9c3);font-size:14px}
.rec b{font-size:16px}.rec ul{margin:6px 0 0;padding-left:18px;font-size:13px}
/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;margin:-4px -4px 14px;padding:4px}
.tabs button{flex:0 0 auto;border:0;background:var(--soft);padding:9px 16px;border-radius:999px;font:inherit;font-weight:700;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--pri);color:#fff}
/* plan */
.sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.sum span{background:var(--soft);border-radius:12px;padding:6px 12px;font-size:13px}.sum b{font-size:15px}
.grid7{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.day{border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;background:#fff}
.day .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}.day .hd b{font-size:16px}
.meal{display:flex;gap:8px;padding:7px 0;border-top:1px dashed var(--line);font-size:14px}.meal:first-of-type{border-top:0}
.meal .ic{width:22px;flex:0 0 22px;text-align:center}.meal .nm{flex:1}.meal .nm a{color:inherit;text-decoration:none;font-weight:600}.meal .nm a:hover{color:var(--pri)}
.meal .kc{font-size:12px;color:var(--muted);white-space:nowrap}
.tot{margin-top:8px;font-size:13px;font-weight:700;border-radius:10px;padding:6px 10px;text-align:center}.tot.good{background:var(--okbg);color:var(--ok)}.tot.off{background:var(--warnbg);color:#92400e}
/* grocery */
.gl{columns:2;column-gap:28px}@media(max-width:700px){.gl{columns:1}}
.gl section{break-inside:avoid;margin-bottom:16px}.gl h4{margin:0 0 6px;font-size:14px;color:var(--pri)}
.gl label.it{display:flex;gap:10px;align-items:center;font-weight:400;color:var(--ink);font-size:14px;margin:0;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer}
.gl label.it input{width:20px;height:20px;accent-color:var(--pri);flex:0 0 auto}.gl .q{color:var(--muted);font-size:13px;margin-left:auto;white-space:nowrap}.gl .done{text-decoration:line-through;opacity:.5}
/* prep */
.prep ol,.prep ul{padding-left:20px;margin:4px 0 10px}.prep li{margin:4px 0;font-size:14px}
.tip{background:#fff7e6;border-radius:12px;padding:8px 12px;font-size:14px;margin:6px 0}
.rc h4{margin:0 0 4px;font-size:15px}.rc p{margin:6px 0;font-size:14px}.rc .meta{font-size:13px;color:var(--muted)}
/* settings */
.set{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:800px){.set{grid-template-columns:1fr}}
.set .card{box-shadow:none;border:1.5px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.stat{background:var(--soft);border-radius:14px;padding:8px;text-align:center}.stat .k{font-size:11px;color:var(--muted);font-weight:700}.stat .v{font-size:17px;font-weight:800}
.level{font-size:26px;font-weight:800;color:var(--pri)}
.sp{max-height:300px;overflow:auto;margin-top:6px}.sp table{width:100%;border-collapse:collapse;font-size:13px}.sp td{padding:6px 4px;border-bottom:1px solid var(--line)}.sp td.pr{color:var(--sale);font-weight:700;white-space:nowrap}.sp tr.used td:first-child{font-weight:700}
table.hist{width:100%;border-collapse:collapse;font-size:14px}table.hist td,table.hist th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
/* modal / wizard */
.modal{position:fixed;inset:0;background:rgba(59,47,42,.45);display:flex;align-items:center;justify-content:center;z-index:9;padding:14px}
.modal .box{background:#fff;border-radius:24px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:24px}
.steps{display:flex;gap:6px;margin-bottom:16px}.steps i{flex:1;height:6px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--pri)}
.wz h2{font-size:22px;margin-bottom:4px}.wz .foot{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.q{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}.q .opts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.q .opts button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;cursor:pointer;font:inherit;font-size:14px}.q .opts button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tile{border:1.5px solid var(--line);border-radius:16px;background:#fff;padding:12px 8px;text-align:center;cursor:pointer;font:inherit;font-weight:600;font-size:14px}
.tile .e{display:block;font-size:26px;margin-bottom:4px}.tile.on{border-color:var(--pri);background:var(--soft)}.tile.rec{grid-column:1/-1;background:linear-gradient(135deg,#fff3e0,#fef9c3)}
.hidden{display:none!important}
.disc{font-size:12px;color:var(--muted);text-align:center;max-width:800px;margin:0 auto 24px;padding:0 16px}
@media(max-width:600px){header h1{font-size:20px}.card{padding:16px}.row3{grid-template-columns:1fr 1fr 1fr}.grid7{grid-template-columns:1fr}.wbar>.f{min-width:100%}.wbar>div:last-child{width:100%}.wbar .btn.big{width:100%}.stats{grid-template-columns:repeat(2,1fr)}.modal .box{padding:18px;border-radius:20px}}
@media print{header,.wbar,.tabs,.btn,.rec{display:none!important}main{margin:0}.card{box-shadow:none}}

/* cook-day timeline */
.cookhd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--soft);border-radius:16px;padding:12px 14px}

<header><div class="wrap"><h1><img class="logo" src="logo.svg" alt="" width="34" height="36"> Chef Momo</h1><div class="chips" id="chips"></div></div></header>
<main>

R('it10','Mushroom & chicken risotto','Italian','m',590,42,62,18,3,40,45,'simmer,sauce,dice,chicken','pot,pan','chicken breast;4;oz;M|arborio rice;0.33;cup dry;G|mushrooms;3;oz;P|onion;0.25;ea;P|garlic;1;clove;P|chicken broth;1.5;cup;G|parmesan;0.5;oz;D|butter;1;tsp;D','Pan-cook diced chicken to 165°F; set aside. Sauté onion, garlic and mushrooms. Toast rice 2 min, then add hot broth one ladle at a time, stirring, letting each absorb (18–20 min) until creamy and al dente. Stir in butter, parmesan and chicken.','Keep the broth hot in a second pot and add it gradually — that slow absorption is what makes it creamy.');
R('md11','Chicken & spinach spanakopita triangles with salad','Mediterranean','m',560,42,45,22,3,45,70,'bake,dough,dice','oven,sheet','chicken breast;4;oz;M|fillo dough sheets;3;sheet;F|spinach;2;cup;P|feta;1;oz;D|eggs;0.25;ea;D|onion;0.25;ea;P|olive oil;2;tsp;G|salad greens;1.5;cup;P','Cook and finely chop chicken; wilt spinach with onion, squeeze dry, mix with chicken, feta and egg. Brush fillo strips with oil, add a spoonful of filling and fold into triangles like a flag. Bake at 375°F 20–25 min until golden. Serve with salad.','Keep fillo you\u2019re not using under a damp towel — it dries out in minutes. Tears are fine; the layers hide them.');
R('me13','Baked kibbeh with yogurt-cucumber salad','Middle Eastern','m',600,40,55,24,3,45,85,'bake,dice','oven','lean ground beef (90%);5;oz;M|bulgur (#1 fine);0.33;cup;G|onion;0.5;ea;P|pine nuts;0.25;oz;G|7-spice (baharat);1;tsp;G|plain yogurt;0.5;cup;D|persian cucumbers;1;ea;P|olive oil;1;tsp;G','Soak bulgur 15 min, squeeze dry, knead with 2/3 of the beef, grated onion and spices. Brown the rest of the beef with onion and pine nuts for the filling. Press half the shell into a pan, add filling, top with remaining shell; score into diamonds, drizzle oil. Bake at 400°F 30–35 min. Serve with yogurt-cucumber salad.','Wet your hands to press the shell layer evenly — about ½ inch thick.');
R('jp11','Chicken katsu with shredded cabbage & rice','Japanese','m',640,46,70,18,3,35,40,'chicken,sear,rice','pan,ricecooker','chicken breast;6;oz;M|panko breadcrumbs;0.5;cup;G|eggs;0.5;ea;D|all-purpose flour;2;tbsp;G|avocado oil;1;tbsp;G|cabbage;1.5;cup;P|tonkatsu sauce;1;tbsp;G|white rice;0.33;cup dry;G','Butterfly and pound chicken to ½ inch. Dredge in flour, egg, then panko. Shallow-fry in ¼ inch oil over medium heat 4–5 min per side until golden and 165°F. Rest on a rack; slice. Serve with finely shredded cabbage, rice and tonkatsu sauce.','Medium heat, not high — the crust browns before the inside cooks if the oil is too hot. Use a thermometer.');
R('kr11','Galbi-jjim — braised beef with radish & carrots (Instant Pot)','Korean','m',620,44,50,24,3,30,75,'sear,pressure,marinate,rice','pressure,ricecooker','beef chuck roast;5;oz;M|soy sauce;2;tbsp;G|bartlett pears;0.25;ea;P|garlic;2;clove;P|ginger;0.5;inch;P|korean radish (mu) or daikon;3;oz;P|carrot;0.5;ea;P|white rice;0.33;cup dry;G','Blend soy, pear, garlic, ginger and a little sugar. Sear beef chunks; pressure cook in the sauce with 0.5 cup water 35 min. Add radish and carrot chunks and pressure cook 5 min more. Reduce sauce on Sauté until glossy. Serve with rice.');
R('in10','Chicken dum biryani (layered rice)','Indian','m',650,45,75,18,3,45,90,'rice,marinate,sauce,dice,chicken','pot','chicken thighs (boneless);5;oz;M|basmati rice;0.33;cup dry;G|plain yogurt;0.33;cup;D|onion;0.75;ea;P|biryani masala;1;tbsp;G|ginger;0.5;inch;P|garlic;2;clove;P|mint;0.25;bunch;P|cilantro;0.25;bunch;P|butter;1;tsp;D','Marinate chicken in yogurt, spices, ginger and garlic 1 h+. Fry sliced onions until deep golden. Par-boil soaked rice in salted water 5 min (70% done). Cook chicken in a heavy pot 10 min, layer onions, herbs and rice, dot with butter, seal tightly and cook on lowest heat 25 min. Fluff gently.','Par-cook the rice only until it breaks with some resistance — it finishes in the steam.');
R('cn11','Pork & cabbage dumplings (jiaozi)','Chinese','m',560,34,60,18,3,60,75,'dough,steam,dice','pan','pork leg (lean, ground or minced);4;oz;M|dumpling wrappers;12;ea;D|napa cabbage;1.5;cup;P|ginger;0.5;inch;P|scallions;1;ea;P|soy sauce;1;tbsp;G|sesame oil;1;tsp;G|black vinegar or rice vinegar;1;tbsp;G','Salt minced cabbage 10 min, squeeze dry. Mix with pork, ginger, scallions, soy and sesame oil. Fill wrappers, wet the edge, fold and pleat. Pan-fry potsticker style: brown bottoms 2 min, add ¼ cup water, cover and steam 6 min. Dip in vinegar-soy. Freeze extras on a tray.','Don\u2019t overfill — about 2 tsp per wrapper. Pleating is optional; a simple half-moon works.');
R('us9','Lighter shrimp & grits','American','m',560,38,55,20,2,25,30,'sear,simmer','pot,pan','shrimp (raw, peeled);5;oz;M|quick grits;0.33;cup dry;G|cheddar;0.5;oz;D|turkey bacon;2;slice;D|bell pepper;0.33;ea;P|garlic;1;clove;P|scallions;1;ea;P|lemon;0.25;ea;P','Simmer grits in water/milk 5–7 min, stir in cheddar. Crisp chopped turkey bacon, sauté pepper and garlic, add shrimp 3–4 min until pink; finish with lemon and scallions. Spoon over grits.');
R('us10','Pan-seared sirloin with pan sauce, mashed potatoes & green beans','American','m',620,44,45,26,3,30,35,'sear,sauce','pan,pot','sirloin tip steak;6;oz;M|potato;6;oz;P|green beans;1;cup;P|garlic;1;clove;P|beef broth;0.33;cup;G|butter;2;tsp;D|dijon mustard;1;tsp;G|almond milk;0.25;cup;D','Boil potatoes until tender; mash with warm milk and a little butter. Sear dried, salted steak 3–4 min per side to 130–135°F for medium-rare; rest. In the same pan add garlic, deglaze with broth, scrape, whisk in mustard and butter. Steam green beans. Slice steak against the grain.','Rest the steak 5 min before slicing so it stays juicy; the pan sauce comes together in that time.');

R('md12','Spinach-feta egg muffins','Mediterranean','b',330,26,8,21,1,15,35,'egg,bake','oven','eggs;3;ea;D|spinach;1;cup;P|feta;0.75;oz;D|cherry tomatoes;3;ea;P|whole-grain bread;1;slice;B','Whisk eggs with chopped spinach, tomato and feta; pour into a greased muffin tin (3 per serving). Bake at 350°F 20–22 min until set. Cool, then refrigerate or freeze. Serve with toast.');
R('am13','Spinach & halebi cheese egg bake','Armenian','b',400,30,20,22,1,15,40,'egg,bake','oven','eggs;3;ea;D|halebi cheese;0.75;oz;D|spinach;1;cup;P|onion;0.25;ea;P|lavash;0.5;sheet;B','Sauté onion and spinach, spread in a baking dish, pour over beaten eggs and crumbled halebi. Bake at 350°F 25 min. Cut into squares; serve with lavash.');
R('jp12','Salmon & edamame onigiri (freezer)','Japanese','b',430,28,58,9,2,25,40,'rice,fish','ricecooker,oven','white rice;0.33;cup dry;G|salmon fillet;2.5;oz;M|edamame (frozen, shelled);0.33;cup;F|roasted seaweed snack;1;pack;G|soy sauce;1;tsp;G','Bake salmon at 400°F 12 min, flake with soy. Mix warm rice with salmon and edamame; shape 2 triangles with wet, salted hands. Wrap each tightly in plastic. Fridge 2 days or freeze; microwave 60–90 s, add seaweed.');
R('kr12','Korean veggie egg muffins with kimchi','Korean','b',320,24,14,18,1,15,35,'egg,bake','oven','eggs;3;ea;D|kimchi;0.25;cup;D|scallions;1;ea;P|carrot;0.25;ea;P|white rice (cooked, day-old);0.25;cup;G','Whisk eggs with chopped kimchi, scallion, grated carrot and rice. Bake in a greased muffin tin at 350°F 20 min. Cool and store.');
R('in11','Masala egg muffins','Indian','b',330,24,14,19,1,15,35,'egg,bake,dice','oven','eggs;3;ea;D|onion;0.25;ea;P|tomato;0.5;ea;P|spinach;0.5;cup;P|green chili;0.5;ea;P|whole-grain bread;1;slice;B','Whisk eggs with diced onion, tomato, spinach, chili, turmeric and garam masala. Bake in a muffin tin at 350°F 20–22 min. Serve with toast.');
R('th10','Thai-style chicken & egg rice jars','Thai','b',420,30,48,11,1,15,30,'rice,egg,chicken','pot,ricecooker','white rice;0.33;cup dry;G|ground chicken;2.5;oz;M|eggs;1;ea;D|fish sauce;1;tsp;G|garlic;1;clove;P|scallions;1;ea;P','Cook rice. Brown chicken with garlic and fish sauce; scramble in the egg. Portion rice + chicken into jars with scallions. Microwave 2 min.');
R('vn12','Vietnamese chicken & ginger rice porridge (cháo gà)','Vietnamese','b',380,28,48,7,1,10,40,'simmer,chicken','pot','white rice;0.25;cup dry;G|chicken breast;3.5;oz;M|ginger;1;inch;P|fish sauce;1;tsp;G|scallions;1;ea;P','Simmer rice in 6x water with ginger 35 min, stirring now and then. Add thin-sliced chicken for the last 8 min (165°F). Season with fish sauce; top with scallions.');
R('cn12','Egg & scallion fried rice jars','Chinese','b',420,20,55,13,1,15,20,'stirfry,egg,rice','wok','white rice (cooked, day-old);1;cup;G|eggs;2;ea;D|frozen peas & carrots;0.33;cup;F|scallions;1;ea;P|soy sauce;1;tsp;G|avocado oil;1;tsp;G','Scramble eggs, add veg and cold rice, toss 3 min with soy and scallions. Portion into containers.');

R("vn13", "Thịt kho trứng — caramel pork & eggs with rice", "Vietnamese", "m", 510, 38, 58, 14, 2, 20, 70, "simmer,egg,rice", "pot,ricecooker", "pork leg (lean, roast);4.5;oz;M|eggs;1;ea;D|coconut water;0.5;cup;G|fish sauce;1;tbsp;G|brown sugar;1;tsp;S|shallot or red onion;0.5;ea;P|garlic;2;clove;P|black pepper;0.25;tsp;S|kosher salt;0.125;tsp;S|white rice;0.33;cup dry;G|scallions;1;ea;P|Thai chilies;0.25;ea;P", "Hard-boil and peel the eggs. Melt the sugar in a dry pot until amber, add cubed pork, shallot and garlic and toss 3 min to coat. Add fish sauce, coconut water, black pepper and the kosher salt; cover and simmer 45 min. Add eggs and simmer 15 min more until the sauce turns glossy. Serve over rice with scallions and chili.", "The caramel (nước màu) should smell toasty, not burnt: pull it the moment it turns amber.");
R("vn14", "Gà kho gừng — ginger caramel chicken with rice", "Vietnamese", "m", 496, 42, 55, 12, 1, 15, 35, "simmer,chicken,rice", "pot,ricecooker", "chicken thighs (boneless);5;oz;M|ginger;1.5;inch;P|fish sauce;1;tbsp;G|brown sugar;1;tsp;S|shallot or red onion;0.5;ea;P|garlic;2;clove;P|black pepper;0.25;tsp;S|white rice;0.33;cup dry;G|scallions;1;ea;P|persian cucumbers;1;ea;P", "Toss chicken pieces with fish sauce, half the sugar and black pepper. Caramelize the rest of the sugar in a pot, add julienned ginger, shallot and garlic for 1 min, then the chicken. Add ¼ cup water per serving, cover and simmer 20 min, then uncover and reduce until sticky. Serve with rice, scallions and sliced cucumber.");
R("vn15", "Bún thịt nướng — grilled lemongrass pork vermicelli bowls", "Vietnamese", "m", 550, 38, 68, 14, 2, 25, 45, "marinate,roast,dice", "oven,sheet,pot", "pork leg (lean, sliced);5;oz;M|lemongrass;1;stalk;P|garlic;2;clove;P|fish sauce;1.5;tbsp;G|brown sugar;1.5;tsp;S|black pepper;0.25;tsp;S|rice vermicelli;2;oz;G|lettuce leaves;3;ea;P|mint;1;tbsp;P|cilantro;1;tbsp;P|carrot;0.5;ea;P|lime;0.5;ea;P|Thai chilies;0.25;ea;P|peanuts;0.25;oz;G", "Marinate sliced pork with minced lemongrass, garlic, 1 tbsp fish sauce, 1 tsp sugar and pepper (30 min–overnight). Spread on a sheet and broil 4–5 min per side until charred. Boil vermicelli 3–4 min and rinse cold. Nước chấm: whisk remaining fish sauce and sugar with lime juice, 3 tbsp water and chili. Build bowls with lettuce, herbs, shredded carrot, noodles and pork; top with peanuts.", "Keep the nước chấm, herbs and noodles in separate containers so nothing goes soggy.");
R("vn16", "Cơm tấm sườn — lemongrass pork chops with broken rice", "Vietnamese", "m", 544, 42, 58, 16, 2, 20, 40, "marinate,sear,rice,egg", "pan,ricecooker", "boneless pork loin chops;5;oz;M|lemongrass;1;stalk;P|garlic;2;clove;P|fish sauce;1;tbsp;G|honey;1;tsp;S|black pepper;0.25;tsp;S|broken rice (cơm tấm) or jasmine rice;0.33;cup dry;G|eggs;0.5;ea;D|persian cucumbers;1;ea;P|tomato;0.5;ea;P|carrot;0.25;ea;P|rice vinegar;1;tbsp;S|lime;0.25;ea;P", "Pound chops thin and marinate with lemongrass, garlic, fish sauce, honey and pepper (1 h–overnight). Sear 3–4 min per side to 145°F. Quick-pickle shredded carrot in rice vinegar with a pinch of sugar and salt. Serve over broken rice with a fried or jammy egg, cucumber, tomato, pickles and a squeeze of lime.");
R("vn17", "Gà xào sả ớt — lemongrass chili chicken stir-fry", "Vietnamese", "m", 492, 44, 52, 12, 1, 15, 20, "stirfry,chicken,rice", "wok,ricecooker", "chicken thighs (boneless);5;oz;M|lemongrass;1;stalk;P|Thai chilies;0.5;ea;P|garlic;2;clove;P|shallot or red onion;0.5;ea;P|fish sauce;1;tbsp;G|brown sugar;0.5;tsp;S|ground turmeric;0.25;tsp;S|black pepper;0.25;tsp;S|avocado oil;1;tsp;S|white rice;0.33;cup dry;G|cilantro;1;tbsp;P", "Toss bite-size chicken with turmeric, half the fish sauce and pepper. Stir-fry minced lemongrass, garlic, shallot and chili in hot oil 1 min until fragrant. Add chicken and cook 6–7 min to 165°F, then the rest of the fish sauce and sugar to glaze. Serve with rice and cilantro.");
R("vn18", "Bò kho — Vietnamese beef stew with star anise (Instant Pot)", "Vietnamese", "m", 466, 40, 45, 14, 2, 25, 75, "pressure,sear,dice", "pressure", "stew meat (beef);5;oz;M|carrot;1;ea;P|lemongrass;1;stalk;P|tomato paste;1;tbsp;G|star anise & cinnamon;1;pinch;S|five-spice powder;0.5;tsp;S|ginger;1;inch;P|garlic;2;clove;P|shallot or red onion;0.5;ea;P|fish sauce;1;tbsp;G|coconut water;0.5;cup;G|black pepper;0.25;tsp;S|baguette;0.25;ea;B|Thai basil;0.125;cup;P|lime;0.25;ea;P", "Toss beef with five-spice, fish sauce and pepper (15 min+). Brown on Sauté, add shallot, garlic, ginger, bruised lemongrass and tomato paste for 1 min. Add coconut water, ½ cup water per serving, star anise and cinnamon; pressure cook 30 min, natural release. Add chunked carrot and pressure cook 3 min more. Serve with baguette (or rice noodles), Thai basil and lime.");
R("vn19", "Phở bò broth kit — freeze the broth, cook noodles fresh", "Vietnamese", "m", 489, 40, 62, 9, 3, 30, 180, "pressure,simmer", "pressure,pot", "beef shank;3;oz;M|sirloin tip steak;2.5;oz;M|onion;0.5;ea;P|ginger;1;inch;P|star anise & cinnamon;1;pinch;S|whole cloves & coriander seeds;0.5;tsp;S|fish sauce;1;tbsp;G|brown sugar;0.5;tsp;S|kosher salt;0.25;tsp;S|rice noodles (phở);2.5;oz;G|bean sprouts;0.5;cup;P|Thai basil;0.125;cup;P|lime;0.25;ea;P|Thai chilies;0.25;ea;P", "Char halved onion and ginger under the broiler or over a flame. Toast star anise, cinnamon, cloves and coriander in a dry pot 1 min. Pressure cook shank with the aromatics, spices and 2½ cups water per serving 45 min, natural release. Strain; season with fish sauce, sugar and the kosher salt. Slice shank; freeze broth and meat in portions. To serve: reheat broth to a boil, pour over soaked noodles and paper-thin raw sirloin, and add sprouts, basil, lime and chili.", "Freeze the sirloin 20 min before slicing so you can cut it paper-thin; the boiling broth cooks it.");
R("vn20", "Bún bò Huế broth kit — spicy lemongrass beef & pork noodle soup", "Vietnamese", "m", 524, 42, 62, 12, 3, 30, 150, "pressure,simmer", "pressure,pot", "beef shank;3;oz;M|pork leg (lean, roast);2;oz;M|lemongrass;2;stalk;P|mắm ruốc (fermented shrimp paste);1;tsp;G|sa tế (chili-lemongrass oil);1;tsp;G|fish sauce;1;tbsp;G|brown sugar;0.5;tsp;S|onion;0.5;ea;P|garlic;2;clove;P|kosher salt;0.25;tsp;S|thick rice vermicelli (bún bò);2.5;oz;G|cabbage;0.5;cup;P|mint;1;tbsp;P|lime;0.25;ea;P", "Pressure cook shank and pork with bruised lemongrass, onion and 2½ cups water per serving 40 min, natural release. Dissolve the shrimp paste in a little hot broth, let it settle and pour in the clear top. Sizzle garlic in the sa tế, stir into the broth with fish sauce, sugar and the kosher salt. Slice the meat; freeze broth and meat in portions. Serve over freshly boiled thick noodles with shredded cabbage, mint and lime.", "Mắm ruốc is pungent but essential; start with half and add to taste.");
R("vn21", "Xôi gà — sticky rice with shredded chicken & crispy shallots", "Vietnamese", "b", 449, 30, 62, 9, 2, 15, 60, "rice,chicken,steam", "pot,ricecooker", "glutinous (sticky) rice;0.33;cup dry;G|chicken breast;3.5;oz;M|shallot or red onion;0.5;ea;P|avocado oil;1;tsp;S|fish sauce;1;tsp;G|ground turmeric;0.25;tsp;S|black pepper;0.25;tsp;S|kosher salt;0.25;tsp;S|scallions;1;ea;P|persian cucumbers;1;ea;P", "Soak sticky rice 4 h or overnight; drain, toss with turmeric and half the salt, and steam 25–30 min until chewy. Poach chicken 12–15 min to 165°F, shred, and toss with fish sauce and pepper. Fry thin-sliced shallots in the oil until golden. Top rice with chicken, crispy shallots, scallion oil and cucumber.", "Sticky rice freezes beautifully; reheat covered in the microwave with a splash of water.");
R("vn22", "Bánh mì chicken bowls with đồ chua pickles", "Vietnamese", "m", 524, 44, 60, 12, 1, 20, 40, "roast,chicken,rice", "oven,sheet,ricecooker", "chicken thighs (boneless);5;oz;M|lemongrass paste;1;tbsp;G|fish sauce;1;tsp;G|honey;1;tsp;S|black pepper;0.25;tsp;S|white rice;0.25;cup dry;G|baguette;0.2;ea;B|carrot;0.5;ea;P|korean radish (mu) or daikon;2;oz;P|rice vinegar;1;tbsp;S|brown sugar;0.5;tsp;S|persian cucumbers;1;ea;P|jalapeño;0.25;ea;P|cilantro;1;tbsp;P|sriracha;1;tsp;G", "Toss chicken with lemongrass paste, fish sauce, honey and pepper; roast at 425°F 18–20 min to 165°F and slice. Đồ chua: julienne carrot and daikon, toss with vinegar, sugar and a pinch of salt (20 min+). Toast baguette cubes into croutons. Build bowls of rice, chicken, pickles, cucumber, jalapeño and cilantro; add croutons and sriracha at serving.");
R("vn23", "Đậu hũ sốt cà chua — tofu in tomato-scallion sauce", "Vietnamese", "m", 468, 26, 55, 16, 1, 15, 25, "sauce,rice,dice", "pan,ricecooker", "firm tofu;7;oz;D|tomato;2;ea;P|shallot or red onion;0.5;ea;P|garlic;2;clove;P|fish sauce;1;tsp;G|brown sugar;0.5;tsp;S|avocado oil;2;tsp;S|black pepper;0.25;tsp;S|kosher salt;0.125;tsp;S|white rice;0.33;cup dry;G|scallions;1;ea;P|cilantro;1;tbsp;P", "Pat tofu dry, cube and pan-fry in half the oil until golden; remove. Sauté shallot and garlic in the rest, add chopped tomatoes, fish sauce, sugar and the kosher salt and cook 6–8 min into a sauce. Return tofu, simmer 3 min, finish with black pepper and scallions. Serve with rice and cilantro.", "For a vegetarian version swap the fish sauce for soy sauce.");
R("vn24", "Chả trứng hấp — steamed egg & pork meatloaf with rice", "Vietnamese", "m", 514, 38, 50, 18, 1, 15, 40, "steam,egg,rice", "pot,ricecooker", "ground pork (lean);3.5;oz;M|eggs;2;ea;D|wood ear mushrooms (dried);0.125;oz;G|rice vermicelli;0.25;oz;G|shallot or red onion;0.33;ea;P|fish sauce;1;tsp;G|black pepper;0.25;tsp;S|kosher salt;0.125;tsp;S|white rice;0.33;cup dry;G|persian cucumbers;1;ea;P|scallions;1;ea;P|lime;0.25;ea;P", "Soak wood ears and vermicelli 10 min; chop. Mix pork, 1½ eggs, mushrooms, noodles, shallot, fish sauce, pepper and the kosher salt; press into a heatproof dish. Steam 25 min, brush the top with the remaining yolk and steam 3 min more until set (160°F). Slice; serve with rice, cucumber, scallions and a squeeze of lime.");
R("vn25", "Canh chua cá — tamarind fish soup base (freezer)", "Vietnamese", "m", 390, 34, 50, 6, 1, 15, 30, "simmer,fish,rice", "pot,ricecooker", "tilapia fillet;5;oz;M|tamarind paste;1;tbsp;G|tomato;1;ea;P|pineapple chunks;0.33;cup;P|celery;1;stalk;P|bean sprouts;0.5;cup;P|fish sauce;1;tbsp;G|brown sugar;1;tsp;S|garlic;2;clove;P|shallot or red onion;0.25;ea;P|Thai chilies;0.25;ea;P|Thai basil;0.125;cup;P|white rice;0.33;cup dry;G", "Fry garlic and shallot until golden. Add 2 cups water per serving, tamarind, tomato wedges, pineapple and sliced celery; simmer 8 min and season with fish sauce and sugar until sweet-sour-salty. Freeze this base in portions. To serve: bring to a boil, add tilapia pieces for 4–5 min until opaque (145°F), then sprouts, basil and chili. Serve with rice.", "The base keeps its brightness frozen; cook the fish fresh when reheating.");
R("vn26", "Trứng chiên thịt bằm — pork & scallion omelet with rice", "Vietnamese", "b", 424, 30, 40, 16, 1, 10, 15, "egg,rice", "pan,ricecooker", "eggs;2;ea;D|ground pork (lean);2;oz;M|scallions;1;ea;P|shallot or red onion;0.25;ea;P|fish sauce;1;tsp;G|black pepper;0.25;tsp;S|avocado oil;1;tsp;S|white rice;0.25;cup dry;G|persian cucumbers;1;ea;P|tomato;0.5;ea;P", "Beat eggs with pork, scallions, shallot, fish sauce and pepper. Cook in the oil over medium heat 3 min per side until puffed and the pork is cooked through. Serve with rice, cucumber and tomato.");
R("vn27", "Chè đậu xanh — mung bean & coconut pudding", "Vietnamese", "s", 244, 12, 40, 4, 1, 5, 40, "simmer", "pot", "split mung beans (dry);0.25;cup;G|light coconut milk;0.25;cup;G|brown sugar;2;tsp;S|vanilla extract (or pandan);0.25;tsp;S|kosher salt;0.0625;tsp;S", "Rinse mung beans and simmer in 1 cup water per serving 25–30 min until creamy, stirring often. Stir in sugar, vanilla and the pinch of salt. Serve warm or cold topped with coconut milk.", "A pinch of salt in the coconut milk is the classic touch.");
R("mx11", "Cochinita pibil-style pork tacos (Instant Pot)", "Mexican", "m", 488, 40, 55, 12, 2, 20, 70, "pressure,marinate", "pressure", "pork leg (lean, roast);5;oz;M|achiote paste;1;tbsp;G|sweet lemon or orange;0.5;ea;P|lime;0.5;ea;P|garlic;2;clove;P|ground cumin;0.5;tsp;S|Mexican oregano;0.5;tsp;S|kosher salt;0.375;tsp;S|red onion;0.25;ea;P|corn tortillas;3;ea;B|black beans (canned);0.33;cup;G|cilantro;1;tbsp;P", "Blend achiote with orange and lime juice, garlic, cumin, oregano and the kosher salt; marinate cubed pork 1 h–overnight. Pressure cook with ¼ cup water per serving 35 min, natural release; shred in the juices. Quick-pickle sliced red onion in lime juice with a pinch of salt. Serve in warm tortillas with beans, pickled onion and cilantro.");
R("mx12", "Chicken enchiladas verdes bake", "Mexican", "m", 474, 45, 42, 14, 2, 25, 45, "bake,chicken", "oven,pot", "chicken breast;5;oz;M|salsa verde;5;tbsp;G|corn tortillas;3;ea;B|queso fresco;1;oz;D|onion;0.25;ea;P|garlic;1;clove;P|ground cumin;0.5;tsp;S|kosher salt;0.25;tsp;S|crema;1;tbsp;D|cilantro;1;tbsp;P|lime;0.25;ea;P", "Poach chicken with onion, garlic and the kosher salt 15 min to 165°F; shred and toss with cumin and a third of the salsa. Roll in warmed tortillas, lay seam-down in a dish, cover with the remaining salsa and queso fresco. Bake at 375°F 20 min. Finish with crema, cilantro and lime at serving.");
R("mx13", "Turkey chorizo-style breakfast tacos with black beans", "Mexican", "b", 398, 34, 34, 14, 1, 15, 15, "egg", "pan", "ground turkey (93% lean);2.5;oz;M|eggs;1;ea;D|corn tortillas;2;ea;B|black beans (canned);0.25;cup;G|ancho chili powder;0.5;tsp;S|smoked paprika;0.25;tsp;S|ground cumin;0.25;tsp;S|apple cider vinegar;1;tsp;S|garlic;1;clove;P|kosher salt;0.25;tsp;S|salsa roja;0.125;cup;G|cilantro;1;tbsp;P", "Brown turkey with garlic, ancho, smoked paprika, cumin, vinegar and the kosher salt until it tastes like chorizo. Push aside and scramble the egg in the same pan. Warm beans and tortillas; fill with turkey, egg and beans, and add salsa and cilantro at serving.");
R("it11", "Chicken piccata with lemon-caper orzo & broccoli", "Italian", "m", 490, 50, 50, 10, 2, 20, 30, "sear,sauce,chicken,pasta", "pan,pot", "chicken breast milanesa (thin cutlets);6;oz;M|all-purpose flour;1;tbsp;G|lemon;0.5;ea;P|capers;1;tsp;G|chicken broth;0.25;cup;G|butter;1;tsp;D|garlic;1;clove;P|orzo;2;oz;G|broccoli;1;cup;P|parsley;1;tbsp;P|black pepper;0.25;tsp;S|kosher salt;0.375;tsp;S", "Season cutlets with half the salt and pepper, dust with flour and sear 2–3 min per side to 165°F. Add garlic, broth, lemon juice and capers to the pan, reduce 2 min and swirl in butter. Boil orzo and broccoli together in salted water 8 min; toss with lemon zest. Spoon sauce over chicken and add parsley at serving.");
R("it12", "Baked turkey polpette in marinara with spaghetti", "Italian", "m", 526, 44, 56, 14, 1, 20, 40, "bake,pasta,sauce", "oven,sheet,pot", "ground turkey (93% lean);5;oz;M|panko breadcrumbs;2;tbsp;G|eggs;0.25;ea;D|parmesan;0.33;oz;D|crushed tomatoes;0.5;cup;G|garlic;2;clove;P|dried oregano;0.5;tsp;S|red pepper flakes;0.125;tsp;S|basil;4;leaf;P|whole-wheat pasta;2;oz;G|black pepper;0.25;tsp;S|kosher salt;0.375;tsp;S", "Mix turkey, panko, egg, half the parmesan, 1 garlic clove, oregano, pepper and half the salt; roll into balls and bake at 400°F 18 min to 165°F. Simmer tomatoes with the rest of the garlic, chili flakes and salt 15 min, add meatballs. Boil pasta in salted water. Serve with basil and the rest of the parmesan.");
R("it13", "Minestrone with white beans, chicken sausage & parmesan", "Italian", "m", 460, 30, 58, 12, 1, 20, 45, "simmer,dice", "pot", "cannellini beans (canned);0.5;cup;G|crushed tomatoes;0.33;cup;G|carrot;0.5;ea;P|celery;1;stalk;P|zucchini;0.5;ea;P|onion;0.33;ea;P|garlic;2;clove;P|whole-wheat pasta;1;oz;G|spinach;1;cup;P|parmesan;0.5;oz;D|chicken sausage (Italian);1;link;M|dried oregano;0.5;tsp;S|dried basil;0.25;tsp;S|olive oil;1;tsp;S|black pepper;0.25;tsp;S|kosher salt;0.375;tsp;S", "Brown sliced sausage in the oil, add diced onion, carrot, celery and garlic for 5 min with oregano and basil. Add tomatoes, beans, zucchini and 1½ cups water per serving with the kosher salt; simmer 20 min. Cook pasta separately and stir in spinach at the end. Finish with parmesan and black pepper.", "Store pasta separately so it doesn’t bloat in the soup.");
R("md13", "Lemon-oregano chicken & chickpea tray bake", "Mediterranean", "m", 482, 42, 38, 18, 1, 10, 35, "roast,chicken", "sheet", "chicken thighs (boneless);5;oz;M|chickpeas (canned);0.5;cup;G|cherry tomatoes;0.75;cup;P|red onion;0.25;ea;P|lemon;0.5;ea;P|garlic;2;clove;P|dried oregano;0.5;tsp;S|sweet paprika;0.5;tsp;S|olive oil;2;tsp;S|black pepper;0.25;tsp;S|kosher salt;0.375;tsp;S|greek yogurt (plain);2;tbsp;D|parsley;1;tbsp;P", "Toss chicken, drained chickpeas, tomatoes and onion with oil, garlic, oregano, paprika, lemon zest, pepper and the kosher salt. Roast at 425°F 25 min until the chicken hits 165°F and the chickpeas crisp. Squeeze lemon over and serve with yogurt and parsley.");
R("md14", "Baked white beans in tomato with feta & eggs", "Mediterranean", "b", 393, 26, 34, 17, 1, 10, 30, "bake,egg", "oven", "cannellini beans (canned);0.5;cup;G|crushed tomatoes;0.5;cup;G|eggs;2;ea;D|feta;0.5;oz;D|onion;0.25;ea;P|garlic;1;clove;P|dried oregano;0.5;tsp;S|dill;1;tbsp;P|olive oil;1;tsp;S|black pepper;0.25;tsp;S|kosher salt;0.125;tsp;S", "Soften onion and garlic in the oil, add tomatoes, beans, oregano and the kosher salt and simmer 5 min. Pour into a baking dish, make wells, crack in eggs and bake at 375°F 12–15 min until whites set. Top with feta, dill and pepper.");
R("md15", "Avgolemono — Greek lemon chicken & rice soup", "Mediterranean", "m", 424, 44, 44, 8, 2, 20, 40, "simmer,egg,chicken,rice", "pot", "chicken breast;5;oz;M|white rice;0.25;cup dry;G|chicken broth;2;cup;G|eggs;0.5;ea;D|lemon;0.75;ea;P|carrot;0.5;ea;P|celery;1;stalk;P|onion;0.33;ea;P|garlic;1;clove;P|dill;1;tbsp;P|black pepper;0.25;tsp;S|kosher salt;0.25;tsp;S", "Simmer broth with diced onion, carrot, celery, garlic and chicken 15 min; remove chicken and shred. Add rice and cook 15 min. Whisk egg with lemon juice, slowly whisk in a ladle of hot broth, then stir back into the pot off the boil until silky. Return chicken, season with the kosher salt and pepper, and finish with dill.", "Reheat gently (don’t boil) so the egg-lemon stays smooth.");
R("me14", "Musakhan-style sumac chicken & onions with pita", "Middle Eastern", "m", 524, 40, 46, 20, 1, 15, 40, "roast,chicken", "sheet,oven", "chicken thighs (boneless);5;oz;M|red onion;0.75;ea;P|sumac;1;tsp;S|7-spice (baharat);0.5;tsp;S|olive oil;2;tsp;S|garlic;1;clove;P|pita;1;ea;B|pine nuts;0.25;oz;G|greek yogurt (plain);2;tbsp;D|lemon;0.25;ea;P|parsley;1;tbsp;P|kosher salt;0.375;tsp;S", "Rub chicken with sumac, baharat, garlic, half the oil and the kosher salt. Roast on a sheet with sliced onions tossed in the remaining oil at 425°F 25 min to 165°F, until the onions are jammy. Toast pine nuts. Serve on warm pita with the onions, pine nuts, yogurt, lemon and parsley.");
R("me15", "Kafta bil sanieh — kofta & potato tomato bake", "Middle Eastern", "m", 458, 36, 38, 18, 2, 25, 55, "bake,dice", "oven", "lean ground beef (90%);4.5;oz;M|potato;5;oz;P|tomato;1;ea;P|onion;0.33;ea;P|parsley;2;tbsp;P|7-spice (baharat);0.75;tsp;S|tomato paste;1;tbsp;G|garlic;1;clove;P|black pepper;0.25;tsp;S|kosher salt;0.375;tsp;S|lemon;0.25;ea;P", "Mix beef with grated onion, parsley, garlic, baharat, pepper and half the salt; press into thin patties. Layer patties, sliced potato and tomato in a baking dish. Whisk tomato paste with ½ cup water per serving and the rest of the salt; pour over. Cover and bake at 400°F 35 min, uncover 10 min. Squeeze lemon over at serving.");
R("me16", "Za’atar egg pita with labneh, cucumber & mint", "Middle Eastern", "b", 408, 26, 40, 16, 1, 10, 15, "bake,egg", "oven", "pita;1;ea;B|za’atar;1;tsp;S|eggs;2;ea;D|labneh or plain yogurt (strained);0.25;cup;D|tomato;0.5;ea;P|persian cucumbers;1;ea;P|olive oil;1;tsp;S|mint;1;tbsp;P|black pepper;0.125;tsp;S|kosher salt;0.125;tsp;S", "Brush pita with oil and za’atar and bake at 400°F 5 min. Soft-boil eggs 7 min (batch for the week). Spread labneh on the pita, add sliced egg, tomato and cucumber, salt and pepper, and finish with mint.");
R("am14", "Turkey & bulgur kufta in tomato-pepper broth", "Armenian", "m", 446, 40, 40, 14, 2, 25, 45, "simmer,dice", "pot", "ground turkey (93% lean);5;oz;M|bulgur (#1 fine);2;tbsp;G|onion;0.33;ea;P|tomato paste;1;tbsp;G|pepper paste (tomato & pepper);1;tbsp;G|Aleppo pepper;0.5;tsp;S|dried mint;0.5;tsp;S|parsley;1;tbsp;P|garlic;1;clove;P|potato;4;oz;P|lemon;0.25;ea;P|black pepper;0.25;tsp;S|kosher salt;0.375;tsp;S", "Soak bulgur in 2 tbsp hot water 10 min. Knead with turkey, grated onion, garlic, Aleppo pepper, half the salt and pepper; roll small balls. Simmer tomato and pepper pastes with 1½ cups water per serving, potato chunks and the rest of the salt 10 min, add kufta and simmer 15 min. Rub in dried mint, finish with parsley and lemon.");
R("am15", "Spas — warm yogurt & wheat soup with chickpeas & mint", "Armenian", "m", 458, 34, 58, 10, 1, 15, 40, "simmer,egg", "pot", "greek yogurt (plain);1;cup;D|hulled wheat (korkot) or pearled wheat;0.25;cup;G|chickpeas (canned);0.33;cup;G|eggs;0.5;ea;D|butter;1;tsp;D|onion;0.25;ea;P|dried mint;1;tsp;S|black pepper;0.125;tsp;S|kosher salt;0.25;tsp;S|lemon;0.125;ea;P", "Simmer wheat in 1½ cups water per serving 25 min until tender. Whisk yogurt with egg until smooth, temper with a ladle of hot liquid, then stir into the pot with chickpeas and the kosher salt; heat gently, stirring, without boiling. Fry onion in butter with the dried mint and pour over. Add lemon and pepper to taste.");
R("am16", "Soujuk & egg skillet with tomato & lavash", "Armenian", "b", 406, 26, 26, 22, 1, 10, 10, "egg", "pan", "eggs;2;ea;D|beef soujuk;1;oz;D|tomato;1;ea;P|lavash;0.5;sheet;B|Aleppo pepper;0.25;tsp;S|parsley;1;tbsp;P|black pepper;0.125;tsp;S|kosher salt;0.0625;tsp;S", "Crisp sliced soujuk in a dry pan 2 min, add diced tomato and cook 3 min. Crack in eggs, cover and cook until set. Season with Aleppo pepper, black pepper and a small pinch of salt (soujuk is salty). Serve with lavash and parsley.");
R("la12", "Arroz con pollo (Instant Pot)", "Latin American", "m", 508, 40, 60, 12, 1, 15, 40, "pressure,rice,chicken", "pressure", "chicken thighs (boneless);5;oz;M|white rice;0.33;cup dry;G|bell pepper;0.5;ea;P|onion;0.33;ea;P|garlic;2;clove;P|frozen peas & carrots;0.33;cup;F|tomato sauce;0.25;cup;G|ground cumin;0.5;tsp;S|sweet paprika;0.5;tsp;S|dried oregano;0.25;tsp;S|chicken broth;0.5;cup;G|kosher salt;0.375;tsp;S|cilantro;1;tbsp;P|lime;0.25;ea;P", "Season chicken with cumin, paprika, oregano and half the salt; brown on Sauté. Add onion, pepper and garlic (sofrito) 3 min, then rinsed rice, tomato sauce, broth and the rest of the salt. Pressure cook 10 min, natural release 10 min. Stir in peas and carrots, rest 5 min. Finish with cilantro and lime.");
R("la13", "Feijoada-style black beans with pork & kale", "Latin American", "m", 532, 44, 62, 12, 2, 20, 60, "pressure,dice,rice", "pressure,ricecooker", "pork leg (lean, roast);4;oz;M|turkey kielbasa;1;oz;M|black beans (canned);0.66;cup;G|onion;0.5;ea;P|garlic;2;clove;P|bay leaf;1;ea;S|ground cumin;0.5;tsp;S|black pepper;0.25;tsp;S|kosher salt;0.375;tsp;S|white rice;0.25;cup dry;G|kale;1;cup;P|sweet lemon or orange;0.25;ea;P", "Brown cubed pork and sliced kielbasa, add onion and garlic 3 min. Add beans with their liquid, bay, cumin, pepper, the kosher salt and ½ cup water per serving; pressure cook 25 min. Sauté shredded kale with a little garlic. Serve over rice with kale and orange wedges.");
R("la14", "Salvadoran-style eggs, beans & plantain plate", "Latin American", "b", 382, 22, 42, 14, 1, 15, 15, "egg", "pan", "eggs;2;ea;D|black beans (canned);0.33;cup;G|ripe plantain;0.33;ea;P|queso fresco;0.5;oz;D|tomato;0.5;ea;P|onion;0.125;ea;P|ground cumin;0.25;tsp;S|black pepper;0.125;tsp;S|kosher salt;0.125;tsp;S|cilantro;1;tbsp;P", "Pan-roast sliced plantain until caramelized. Mash beans with cumin and a pinch of the salt and warm. Scramble eggs with diced tomato and onion (huevos picados), salt and pepper. Plate with beans, plantain, queso fresco and cilantro.");
R("jp13", "Gyudon — beef & onion rice bowls", "Japanese", "m", 516, 40, 62, 12, 1, 15, 20, "simmer,rice", "pan,ricecooker", "sirloin tip steak;5;oz;M|onion;0.5;ea;P|dashi or chicken broth;0.33;cup;G|soy sauce;1;tbsp;G|mirin;1;tbsp;G|ginger;0.5;inch;P|white rice;0.33;cup dry;G|scallions;1;ea;P|red pickled ginger (beni shoga);1;tsp;G|white pepper;0.0625;tsp;S", "Simmer sliced onion and ginger in dashi, soy and mirin 5 min. Add paper-thin beef and simmer 2 min until just cooked. Serve over rice with scallions and pickled ginger.");
R("jp14", "Chicken tsukune meatballs with tare & rice", "Japanese", "m", 508, 40, 60, 12, 2, 20, 35, "bake,rice", "oven,sheet,ricecooker", "ground chicken;5;oz;M|scallions;1;ea;P|ginger;0.5;inch;P|panko breadcrumbs;2;tbsp;G|eggs;0.25;ea;D|soy sauce;1;tbsp;G|mirin;1;tbsp;G|honey;1;tsp;S|white rice;0.33;cup dry;G|persian cucumbers;1;ea;P|red pepper flakes (or ichimi);0.0625;tsp;S|white pepper;0.0625;tsp;S", "Mix chicken, minced scallion, grated ginger, panko, egg and white pepper; shape ovals. Bake at 425°F 15 min to 165°F. Reduce soy, mirin and honey 2 min into tare and brush on. Serve over rice with cucumber and a pinch of ichimi.");
R("jp15", "Butaniku shōgayaki — ginger pork with cabbage & rice", "Japanese", "m", 500, 40, 58, 12, 1, 15, 20, "sear,rice", "pan,ricecooker", "pork leg (lean, sliced);5;oz;M|ginger;1;inch;P|soy sauce;1;tbsp;G|mirin;1;tbsp;G|garlic;1;clove;P|onion;0.25;ea;P|cabbage;1;cup;P|white rice;0.33;cup dry;G|scallions;1;ea;P|rice vinegar;1;tsp;S", "Mix grated ginger, garlic, soy and mirin. Sear thin pork with sliced onion 3 min, pour in the sauce and toss until glossy. Serve with rice and finely shredded cabbage dressed with rice vinegar; top with scallions.");
R("kr13", "Dakgalbi — spicy chicken, cabbage & sweet potato stir-fry", "Korean", "m", 516, 42, 60, 12, 2, 20, 40, "stirfry,chicken,marinate", "wok,ricecooker", "chicken thighs (boneless);5;oz;M|gochujang;1;tbsp;G|gochugaru (Korean chili flakes);0.5;tsp;S|soy sauce;1;tsp;G|garlic;2;clove;P|ginger;0.5;inch;P|honey;1;tsp;S|cabbage;1.5;cup;P|sweet potato;3;oz;P|onion;0.25;ea;P|scallions;1;ea;P|white rice;0.25;cup dry;G", "Marinate chicken with gochujang, gochugaru, soy, garlic, ginger and honey (20 min–overnight). Stir-fry sweet potato sticks 4 min, add chicken and cook 6 min, then cabbage and onion until wilted and the chicken hits 165°F. Finish with scallions; serve with rice.");
R("kr14", "Dubu jorim — spicy braised tofu with spinach namul", "Korean", "m", 476, 28, 55, 16, 1, 15, 25, "simmer,rice", "pan,ricecooker", "firm tofu;7;oz;D|soy sauce;1;tbsp;G|gochugaru (Korean chili flakes);0.5;tsp;S|garlic;2;clove;P|scallions;1;ea;P|onion;0.25;ea;P|honey;0.5;tsp;S|sesame oil;0.5;tsp;S|white rice;0.33;cup dry;G|spinach;1;cup;P|rice vinegar;1;tsp;S", "Pan-fry tofu slabs until golden. Mix soy, gochugaru, garlic, honey and ¼ cup water; pour over the tofu with sliced onion and simmer 8 min, spooning the sauce over. Blanch spinach 30 s, squeeze and dress with sesame oil, a pinch of salt and vinegar. Serve with rice; scallions on top.");
R("kr15", "Kimchi fried rice jars with egg", "Korean", "b", 432, 28, 44, 16, 1, 15, 15, "rice,egg", "pan", "white rice (cooked, day-old);0.75;cup;G|kimchi;0.33;cup;D|eggs;2;ea;D|ground pork (lean);1.5;oz;M|gochujang;1;tsp;G|scallions;1;ea;P|sesame oil;0.5;tsp;S|garlic;1;clove;P", "Brown pork with garlic, add chopped kimchi and gochujang and fry 3 min. Add cold rice and fry until crackly. Pack into jars; top each with a jammy boiled egg (or fry eggs fresh) and scallions, drizzle with sesame oil.");
R("th11", "Gai yang-style roast chicken with sticky rice & jaew", "Thai", "m", 524, 40, 64, 12, 1, 15, 45, "roast,chicken,marinate", "oven,sheet,ricecooker", "chicken thighs (boneless);5;oz;M|lemongrass;1;stalk;P|garlic;2;clove;P|cilantro;1;tbsp;P|fish sauce;1;tbsp;G|white pepper;0.25;tsp;S|honey;1;tsp;S|glutinous (sticky) rice;0.33;cup dry;G|persian cucumbers;1;ea;P|lime;0.25;ea;P|Thai chilies;0.25;ea;P|tamarind paste;1;tsp;G", "Pound lemongrass, garlic and cilantro stems; mix with fish sauce, white pepper and honey and marinate chicken (1 h–overnight). Roast at 425°F 20–25 min to 165°F. Steam soaked sticky rice 25 min. Jaew: mix tamarind, lime, chili and a splash of fish sauce. Serve with cucumber.");
R("th12", "Massaman beef & potato curry (Instant Pot)", "Thai", "m", 540, 40, 50, 20, 2, 20, 60, "pressure,simmer", "pressure", "stew meat (beef);5;oz;M|potato;4;oz;P|onion;0.33;ea;P|light coconut milk;0.33;cup;G|massaman curry paste;1;tbsp;G|peanuts;0.25;oz;G|tamarind paste;1;tsp;G|fish sauce;1;tsp;G|brown sugar;0.5;tsp;S|star anise & cinnamon;1;pinch;S|white rice;0.25;cup dry;G", "Fry curry paste in a splash of coconut milk on Sauté 1 min, add beef and coat. Add the rest of the coconut milk, ¼ cup water per serving, cinnamon and star anise; pressure cook 25 min. Add potato and onion, pressure cook 4 min. Season with tamarind, fish sauce and sugar; top with peanuts and serve with rice.");
R("th13", "Khao man gai — poached chicken & ginger rice", "Thai", "m", 488, 44, 60, 8, 2, 20, 45, "simmer,chicken,rice", "pot,ricecooker", "chicken breast;5;oz;M|white rice;0.33;cup dry;G|ginger;1;inch;P|garlic;2;clove;P|chicken broth;0.5;cup;G|persian cucumbers;1;ea;P|cilantro;1;tbsp;P|soy sauce;1;tsp;G|tao jiew (fermented soybean paste);1;tsp;G|Thai chilies;0.25;ea;P|rice vinegar;1;tsp;S|white pepper;0.125;tsp;S", "Poach chicken with sliced ginger in salted water 15 min to 165°F; slice. Fry garlic and ginger, add rice and cook it in the poaching broth. Sauce: mix tao jiew, soy, vinegar, minced ginger, garlic and chili. Serve chicken over rice with cucumber and cilantro, sauce on the side.");
R("in12", "Chicken saag with brown rice", "Indian", "m", 474, 42, 45, 14, 2, 20, 40, "simmer,chicken,dice", "pot,blender", "chicken thighs (boneless);5;oz;M|spinach;2;cup;P|onion;0.33;ea;P|tomato;0.5;ea;P|garlic;2;clove;P|ginger;0.5;inch;P|greek yogurt (plain);2;tbsp;D|garam masala;0.5;tsp;S|ground cumin;0.5;tsp;S|ground turmeric;0.25;tsp;S|Kashmiri chili powder;0.25;tsp;S|brown rice;0.25;cup dry;G|kosher salt;0.375;tsp;S|lemon;0.125;ea;P", "Blanch spinach 1 min and blend smooth. Brown onion, then garlic, ginger, cumin, turmeric and chili 30 s. Add chicken and tomato and cook 8 min, then the spinach and the kosher salt; simmer 10 min to 165°F. Stir in yogurt off the heat and finish with garam masala and lemon. Serve with rice.");
R("in13", "Rajma — kidney bean curry with basmati & raita", "Indian", "m", 470, 24, 80, 6, 1, 15, 35, "simmer,dice,rice", "pot", "kidney beans (canned);0.75;cup;G|crushed tomatoes;0.33;cup;G|onion;0.33;ea;P|garlic;2;clove;P|ginger;0.5;inch;P|ground cumin;0.5;tsp;S|ground coriander;0.5;tsp;S|garam masala;0.25;tsp;S|Kashmiri chili powder;0.25;tsp;S|basmati rice;0.25;cup dry;G|greek yogurt (plain);0.33;cup;D|cilantro;1;tbsp;P|kosher salt;0.375;tsp;S", "Brown onion, add garlic, ginger, cumin, coriander and chili for 30 s, then tomatoes and the kosher salt; cook 5 min. Add beans and ½ cup water per serving, simmer 15 min, mashing a few beans to thicken. Finish with garam masala. Serve with basmati and yogurt raita with cilantro.");
R("in14", "Kanda poha with peanuts & boiled egg", "Indian", "b", 381, 16, 50, 13, 1, 15, 15, "egg", "pan", "flattened rice (poha);0.75;cup;G|onion;0.25;ea;P|peanuts;0.25;oz;G|eggs;1;ea;D|black mustard seeds;0.25;tsp;S|ground turmeric;0.25;tsp;S|green chili;0.25;ea;P|frozen peas & carrots;0.25;cup;F|lemon;0.25;ea;P|cilantro;1;tbsp;P|kosher salt;0.25;tsp;S", "Rinse poha and drain. Pop mustard seeds in a little oil, add peanuts, onion and chili until soft, then turmeric, peas and carrots. Fold in poha with the kosher salt and steam covered 2 min. Finish with lemon and cilantro; serve with a halved boiled egg.");
R("cn13", "Hong shao rou — lean red-braised pork with bok choy", "Chinese", "m", 500, 40, 58, 12, 2, 20, 60, "pressure,simmer,rice", "pressure,ricecooker", "pork leg (lean, roast);5;oz;M|soy sauce;1;tbsp;G|brown sugar;1;tsp;S|star anise & cinnamon;1;pinch;S|ginger;1;inch;P|garlic;2;clove;P|scallions;1;ea;P|rice vinegar;1;tsp;S|bok choy;1;ea;P|white rice;0.33;cup dry;G", "Caramelize the sugar, add cubed pork, ginger, garlic and scallion whites and toss. Add soy, star anise, cinnamon and ⅓ cup water per serving; pressure cook 25 min, then reduce on Sauté until glossy and add the vinegar. Blanch bok choy. Serve with rice and scallion greens.");
R("cn14", "Chicken & mushroom stir-fry with oyster sauce", "Chinese", "m", 472, 44, 56, 8, 1, 15, 20, "stirfry,chicken,rice", "wok,ricecooker", "chicken breast;5;oz;M|mushrooms;3;oz;P|bell pepper;0.5;ea;P|garlic;2;clove;P|ginger;0.5;inch;P|oyster sauce;1;tbsp;G|soy sauce;1;tsp;G|cornstarch;1;tsp;S|white pepper;0.125;tsp;S|white rice;0.33;cup dry;G|scallions;1;ea;P", "Toss sliced chicken with cornstarch, soy and white pepper. Stir-fry in a hot wok 4 min; remove. Stir-fry mushrooms and pepper with garlic and ginger 3 min, return chicken with oyster sauce and a splash of water and toss until glossy (165°F). Serve with rice and scallions.");
R("cn15", "Yu xiang eggplant with ground pork", "Chinese", "m", 494, 30, 62, 14, 2, 20, 30, "stirfry,rice", "wok,ricecooker", "Chinese eggplant;1;ea;P|ground pork (lean);3.5;oz;M|doubanjiang (chili bean paste);1;tbsp;G|garlic;2;clove;P|ginger;0.5;inch;P|scallions;1;ea;P|black vinegar or rice vinegar;1;tsp;G|soy sauce;1;tsp;G|cornstarch;1;tsp;S|brown sugar;0.5;tsp;S|Sichuan peppercorn (ground);0.125;tsp;S|white rice;0.33;cup dry;G", "Steam or microwave eggplant batons 5 min until tender. Brown pork, add doubanjiang, garlic and ginger 1 min. Add eggplant, soy, vinegar, sugar and a slurry of cornstarch in ¼ cup water; toss until glossy. Finish with scallions and Sichuan pepper; serve with rice.");
R("us11", "Buffalo chicken bowls with ranch yogurt & sweet potato", "American", "m", 450, 52, 38, 10, 1, 15, 35, "roast,chicken", "sheet", "chicken breast;6;oz;M|hot sauce;1;tbsp;G|butter;1;tsp;D|greek yogurt (plain);0.25;cup;D|garlic powder;0.25;tsp;S|dill;1;tbsp;P|celery;1;stalk;P|carrot;0.5;ea;P|lettuce leaves;3;ea;P|sweet potato;5;oz;P|blue cheese;0.33;oz;D|black pepper;0.25;tsp;S|kosher salt;0.25;tsp;S", "Roast sweet potato cubes at 425°F 25 min; add chicken seasoned with garlic powder, pepper and the kosher salt for the last 18 min (165°F). Slice and toss with hot sauce and melted butter. Ranch: yogurt, dill, garlic powder and a pinch of salt. Serve with lettuce, celery, carrot and blue cheese; ranch on the side.");
R("us12", "Turkey meatloaf muffins with mashed potatoes & green beans", "American", "m", 476, 42, 50, 12, 1, 20, 40, "bake", "oven,pot", "ground turkey (93% lean);5;oz;M|panko breadcrumbs;2;tbsp;G|eggs;0.25;ea;D|onion;0.25;ea;P|tomato paste;1;tbsp;G|garlic powder;0.25;tsp;S|dried thyme;0.25;tsp;S|smoked paprika;0.25;tsp;S|potato;6;oz;P|green beans;1;cup;P|greek yogurt (plain);2;tbsp;D|black pepper;0.25;tsp;S|kosher salt;0.375;tsp;S", "Mix turkey, panko, egg, grated onion, garlic powder, thyme, paprika, pepper and half the salt; press into a muffin tin, brush with tomato paste and bake at 400°F 20 min to 165°F. Boil potatoes in salted water and mash with yogurt and the rest of the salt. Steam green beans 5 min.");
R("us13", "Cottage-cheese egg bites with spinach & cheddar", "American", "b", 360, 32, 22, 16, 1, 10, 30, "egg,bake", "oven", "eggs;2;ea;D|cottage cheese (low-fat);0.33;cup;D|spinach;0.5;cup;P|bell pepper;0.25;ea;P|cheddar;0.5;oz;D|onion;0.125;ea;P|smoked paprika;0.25;tsp;S|black pepper;0.125;tsp;S|kosher salt;0.125;tsp;S|whole-grain bread;1;slice;B", "Blend eggs with cottage cheese, paprika, pepper and the kosher salt until smooth. Divide chopped spinach, pepper and onion into a greased muffin tin, pour over the egg and top with cheddar. Bake at 325°F 22–25 min until just set. Serve with toast.", "Low oven heat keeps them custardy like the coffee-shop version.");


/* ---------- Polish ---------- */
R('pl1','Twaróg z rzodkiewką — farmer\u2019s cheese with radish, chives & rye toast','Polish','b',450,38,37,14,1,10,10,'egg,dice','pot','farmer\u2019s cheese (twaróg);0.66;cup;D|eggs;1;ea;D|rye bread;2;slice;B|radishes;4;ea;P|persian cucumbers;1;ea;P|chives;1;tbsp;P|dill;1;tbsp;P|kosher salt;0.25;tsp;S|black pepper;0.125;tsp;S|sweet paprika;0.125;tsp;S','Hard-boil eggs 9–10 min (batch for the week). Mash the twaróg with a splash of water, the kosher salt, black pepper, chopped chives and dill; fold in diced radish. Serve on rye toast with sliced cucumber, a halved egg and a dusting of paprika.','Twaróg is Polish farmer\u2019s cheese; dry-curd cottage cheese or well-drained cottage cheese works too.');
R('pl2','Placki owsiane — oat & apple pancakes with cinnamon yogurt','Polish','b',410,25,49,13,1,15,20,'egg','pan','rolled oats;0.5;cup;G|eggs;2;ea;D|apple;0.5;ea;P|greek yogurt (plain);0.33;cup;D|honey;1;tsp;S|ground cinnamon;0.5;tsp;S|vanilla extract;0.25;tsp;S|kosher salt;0.0625;tsp;S','Blitz or mash oats with eggs, grated apple, half the cinnamon, vanilla and the salt; rest 5 min. Cook small pancakes in a lightly oiled nonstick pan 2–3 min per side. Stir the rest of the cinnamon and honey into the yogurt for dipping.','Freeze pancakes flat with parchment between them; reheat 2 min in a toaster or skillet.');
R('pl3','Mizeria — cucumber-dill salad with Greek yogurt & egg','Polish','s',170,19,9,6,1,10,15,'egg,dice','pot','greek yogurt (plain);0.5;cup;D|persian cucumbers;2;ea;P|eggs;1;ea;D|dill;1;tbsp;P|chives;1;tbsp;P|lemon;0.25;ea;P|kosher salt;0.125;tsp;S|black pepper;0.125;tsp;S','Thinly slice cucumbers, toss with the kosher salt and let them weep 10 min; squeeze dry. Mix with yogurt, chopped dill and chives, a squeeze of lemon and black pepper. Eat with a halved hard-boiled egg.');
R('pl4','Bigos — hunter\u2019s stew with pork, turkey kielbasa & sauerkraut','Polish','m',475,35,51,15,2,25,120,'simmer,dice','pot','sauerkraut (jarred, drained);1;cup;G|cabbage;1;cup;P|pork leg (lean, roast);3;oz;M|turkey kielbasa;2;oz;M|mushrooms;2;oz;P|onion;0.5;ea;P|tomato paste;1;tbsp;G|prunes;2;ea;G|olive oil;1;tsp;S|garlic;1;clove;P|bay leaf;1;ea;S|allspice berries;2;ea;S|dried marjoram;0.5;tsp;S|caraway seeds;0.25;tsp;S|black pepper;0.25;tsp;S|kosher salt;0.25;tsp;S|rye bread;1;slice;B','Brown cubed pork and sliced kielbasa in the oil; remove. Soften diced onion, mushrooms and garlic 6 min with the marjoram and caraway. Add sauerkraut (rinse it if very sour), shredded cabbage, tomato paste, chopped prunes, bay, allspice, pepper, the kosher salt and meat with 0.5 cup water per serving. Cover and simmer gently 1½ h, stirring now and then, until the pork is tender and the cabbage is soft and brown. Serve with rye bread.','Bigos famously tastes better on day 2–3; it\u2019s the perfect batch dish.');
R('pl5','Gołąbki — cabbage rolls with beef & rice in tomato sauce','Polish','m',480,32,58,13,3,45,100,'rice,roll,bake,dice','pot,oven','cabbage;1.5;cup;P|lean ground beef (90%);4;oz;M|white rice;0.25;cup dry;G|onion;0.33;ea;P|garlic;1;clove;P|eggs;0.25;ea;D|tomato sauce;0.5;cup;G|dried marjoram;0.5;tsp;S|sweet paprika;0.5;tsp;S|black pepper;0.25;tsp;S|allspice (ground);0.125;tsp;S|kosher salt;0.375;tsp;S|dill;1;tbsp;P','Core a head of cabbage and blanch it in salted boiling water, peeling off leaves as they soften (shave the thick rib). Par-cook rice 8 min. Mix beef, rice, sautéed onion and garlic, egg, marjoram, paprika, allspice, pepper and the kosher salt. Roll ~⅓ cup filling in each leaf, pack seam-down in a baking dish, pour tomato sauce over, cover and bake at 350°F 1 h until the beef reaches 160°F. Finish with dill.','Roll the filling snug but not tight — the rice swells as it bakes.');
R('pl6','Baked chicken kotlet with dill potatoes & mizeria','Polish','m',510,50,47,12,1,20,40,'bake,chicken,dice','oven,sheet,pot','chicken breast milanesa (thin cutlets);6;oz;M|panko breadcrumbs;0.33;cup;G|eggs;0.5;ea;D|potato;6;oz;P|persian cucumbers;1;ea;P|greek yogurt (plain);2;tbsp;D|dill;1;tbsp;P|lemon;0.25;ea;P|garlic;1;clove;P|olive oil;1;tsp;S|garlic powder;0.25;tsp;S|sweet paprika;0.25;tsp;S|black pepper;0.25;tsp;S|kosher salt;0.375;tsp;S','Season cutlets with half the salt, garlic powder, paprika and pepper. Dip in beaten egg then panko, set on an oiled sheet and bake at 425°F 15–18 min, flipping once, to 165°F. Boil potatoes in salted water 15 min; toss with dill, a grated garlic clove and a little oil. Slice cucumber, salt it, squeeze dry and mix with yogurt, lemon and dill (mizeria).','Kotlet schabowy is usually pork; thin chicken cutlets bake crisp with far less oil.');
R('pl7','Kielbasa, cabbage & potato sheet pan with mustard','Polish','m',530,26,63,19,1,10,40,'roast,dice','sheet','turkey kielbasa;4;oz;M|cabbage;2;cup;P|potato;6;oz;P|onion;0.5;ea;P|cannellini beans (canned);0.33;cup;G|olive oil;2;tsp;S|whole-grain mustard;1;tsp;G|caraway seeds;0.25;tsp;S|smoked paprika;0.5;tsp;S|dried marjoram;0.25;tsp;S|black pepper;0.125;tsp;S|kosher salt;0.25;tsp;S|apple cider vinegar;1;tsp;S|dill;1;tbsp;P|garlic;2;clove;P','Toss cabbage wedges, potato chunks, onion and smashed garlic with oil, caraway, smoked paprika, marjoram, pepper and the kosher salt. Roast at 425°F 20 min. Add sliced kielbasa and drained beans, roast 15 min more until the cabbage edges char. Whisk mustard with vinegar and drizzle over; finish with dill.');
R('pl8','Żurek-style sour rye soup with kielbasa, potato & egg','Polish','m',455,27,59,12,1,15,40,'simmer,egg,dice','pot','żurek starter (fermented rye flour);0.5;cup;G|chicken broth;1.5;cup;G|turkey kielbasa;2;oz;M|potato;5;oz;P|eggs;1;ea;D|onion;0.33;ea;P|garlic;2;clove;P|greek yogurt (plain);2;tbsp;D|prepared horseradish;1;tsp;G|dried marjoram;1;tsp;S|bay leaf;1;ea;S|allspice berries;2;ea;S|black pepper;0.25;tsp;S|kosher salt;0.25;tsp;S|rye bread;1;slice;B','Brown sliced kielbasa with onion and garlic. Add broth, diced potato, bay and allspice; simmer 15 min. Shake the żurek starter, stir it in and simmer 10 min more (don\u2019t boil hard). Season with marjoram, pepper, horseradish and the kosher salt. Whisk a ladle of soup into the yogurt and stir back in. Serve with a halved hard-boiled egg and rye bread.','Żurek starter (zakwas) is sold in jars or bottles at Eastern European markets; it may contain wheat.');
R('pl9','Kasza gryczana — buckwheat & mushroom bowls with chicken & dill yogurt','Polish','m',465,42,51,12,2,25,35,'sear,simmer,chicken,dice','pot,pan','buckwheat groats (kasha);0.33;cup dry;G|chicken thighs (boneless);5;oz;M|mushrooms;4;oz;P|onion;0.5;ea;P|butter;1;tsp;D|greek yogurt (plain);2;tbsp;D|dill;1;tbsp;P|garlic;1;clove;P|dried marjoram;0.5;tsp;S|sweet paprika;0.5;tsp;S|black pepper;0.25;tsp;S|kosher salt;0.375;tsp;S|lemon;0.25;ea;P','Toast buckwheat in a dry pot 2 min, add 2× water and a pinch of the salt, cover and simmer 15 min. Rub chicken with paprika, marjoram, pepper and half the salt; sear 5–6 min per side to 165°F and slice. Sauté onion, mushrooms and garlic in butter until deeply browned; fold into the kasha. Mix yogurt with dill, lemon and the last of the salt to spoon on top.');
R('pl10','Gulasz — pork & paprika stew with pearl barley','Polish','m',470,40,55,10,2,25,90,'sear,simmer,dice','pressure','pork leg (lean, roast);5;oz;M|pearl barley;0.25;cup dry;G|onion;0.5;ea;P|bell pepper;0.5;ea;P|mushrooms;2;oz;P|tomato paste;1;tbsp;G|garlic;2;clove;P|olive oil;1;tsp;S|sweet paprika;1.5;tsp;S|smoked paprika;0.5;tsp;S|caraway seeds;0.25;tsp;S|dried marjoram;0.5;tsp;S|bay leaf;1;ea;S|black pepper;0.25;tsp;S|kosher salt;0.375;tsp;S|greek yogurt (plain);2;tbsp;D|dill;1;tbsp;P','Sear cubed pork in the oil on Sauté. Add onion, pepper, mushrooms and garlic, cook 4 min, then stir in both paprikas, caraway and marjoram for 30 s. Add tomato paste, bay, the kosher salt, pepper and 0.75 cup water per serving; pressure cook 25 min, natural release. Simmer barley separately in salted water 30 min. Serve stew over barley with yogurt and dill.');
R('pl11','Pierogi ruskie — potato & farmer\u2019s cheese dumplings (freezer batch)','Polish','m',460,27,66,9,3,60,90,'dough,simmer,dice','pot,pan','all-purpose flour;6.5;tbsp;G|eggs;0.25;ea;D|potato;4;oz;P|farmer\u2019s cheese (twaróg);0.33;cup;D|onion;0.33;ea;P|butter;1;tsp;D|greek yogurt (plain);3;tbsp;D|chives;1;tbsp;P|black pepper;0.25;tsp;S|kosher salt;0.375;tsp;S|garlic;1;clove;P','Knead flour, egg, a pinch of the salt and warm water into a soft dough; rest 20 min. Boil potatoes, mash with twaróg, half the onion fried golden in butter with the garlic, plenty of black pepper and the rest of the salt. Roll dough thin, cut 3-in rounds, fill and pinch shut. Boil in salted water until they float plus 2 min. Freeze extras raw on a tray, then bag. Serve with the remaining fried onion, yogurt and chives.','Cook pierogi straight from frozen (add 2–3 min); pan-fry boiled ones in a little butter to reheat.');
R('pl12','Ogórki kiszone & kielbasa snack plate','Polish','s',130,8,12,5,1,2,2,'','','pickles;2;spear;G|turkey kielbasa;1.5;oz;M|rye crispbread;1;ea;B|whole-grain mustard;1;tsp;G','Slice kielbasa, add pickles, crispbread and a swipe of mustard.');

function chartSVG(list, pr, m) {
  if (list.length < 1) return '';

  const last = list[list.length - 1];
  const proj = m.ok && m.goalDate && m.mode !== 'maintain' ? [{ date: last.date, lb: last.lb }, { date: m.goalDate, lb: pr.goalLb }] : [];
  const xs = list.concat(proj).map(x => dd(x.date)); const maxX = Math.max(14, ...xs);
  const ys = list.map(x => x.lb).concat([pr.goalLb]); const lo = Math.min(...ys) - 2, hi = Math.max(...ys) + 2;
  const X = v => P.l + v / maxX * (CW - P.l - P.r), Y = v => P.t + (1 - (v - lo) / (hi - lo)) * (H - P.t - P.b);
  let g = '';
  for (let i = 0; i <= 2; i++) { const v = lo + (hi - lo) * i / 2; g += `<line x1="${P.l}" x2="${CW - P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#f1e4d8"/><text x="${P.l - 4}" y="${Y(v) + 4}" font-size="10" text-anchor="end" fill="#8a7a70">${Math.round(W(v))}</text>`; }
  g += `<line x1="${P.l}" x2="${CW - P.r}" y1="${Y(pr.goalLb)}" y2="${Y(pr.goalLb)}" stroke="#15803d" stroke-dasharray="4 4"/><text x="${CW - P.r}" y="${Y(pr.goalLb) - 4}" font-size="10" text-anchor="end" fill="#15803d">goal ${W(pr.goalLb)} ${WU()}</text>`;
  if (proj.length) g += `<line x1="${X(dd(proj[0].date))}" y1="${Y(proj[0].lb)}" x2="${X(dd(proj[1].date))}" y2="${Y(proj[1].lb)}" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 5"/>`;
  g += `<polyline fill="none" stroke="#ea580c" stroke-width="3" stroke-linejoin="round" points="${list.map(x => X(dd(x.date)) + ',' + Y(x.lb)).join(' ')}"/>` + list.map(x => `<circle cx="${X(dd(x.date))}" cy="${Y(x.lb)}" r="4" fill="#ea580c"/>`).join('');
  g += `<text x="${P.l}" y="${H - 6}" font-size="10" fill="#8a7a70">${fmtD(list[0].date)}</text>${proj.length ? `<text x="${CW - P.r}" y="${H - 6}" font-size="10" text-anchor="end" fill="#8a7a70">${fmtD(m.goalDate)}</text>` : ''}`;
  return `<svg class="chart" viewBox="0 0 ${CW} ${H}" role="img" aria-label="Weight trend">${g}</svg><div class="hint" style="margin-top:2px"><b style="color:#ea580c">━</b> weigh-ins · <b style="color:#f59e0b">┅</b> projected · <b style="color:#15803d">┅</b> goal</div>`;
}
